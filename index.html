<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceRoom</title>
    <!-- Stable WebRTC Engine Link -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1118;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b26;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #5865F2; font-size: 28px; letter-spacing: 0.5px; }
        p { color: #a3a6ac; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            color: #a3a6ac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #202635;
            border: 1px solid #2d3548;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: #5865F2; }

        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background-color: #4752c4; }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffaa00;
        }
        .connected { color: #00fa9a !important; }
        
        .user-list {
            margin-top: 20px;
            background: #202635;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            border: 1px solid #2d3548;
        }
        .user-list h3 { margin: 0 0 10px 0; font-size: 14px; color: #5865F2; text-transform: uppercase; }
        .user-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            padding: 6px 0;
            color: #e3e5e8;
        }
        .user-item::before {
            content: "●";
            color: #00fa9a;
            margin-right: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>VoiceRoom</h1>
    <p>Enter your nickname to join the room stream instantly.</p>
    
    <div id="setup-area">
        <div class="input-group">
            <label for="username">Your Nickname</label>
            <input type="text" id="username" placeholder="e.g., Alex" autocomplete="off">
        </div>
        <button class="btn" id="join-btn">Connect to VoiceRoom</button>
    </div>

    <div class="status" id="status-text" style="display: none;">Connecting...</div>

    <div class="user-list" id="user-box" style="display: none;">
        <h3>Active Speakers</h3>
        <div id="active-users-container"></div>
    </div>
</div>

<script>
    // Universal Room Address Key
    const MASTER_ROOM_KEY = "nirob_global_voice_lobby_channel_production";
    let localAudioStream = null;
    let networkingPeer = null;
    let clientNickname = "";

    const connectButton = document.getElementById('join-btn');
    const nameInputField = document.getElementById('username');
    const interfaceSetupArea = document.getElementById('setup-area');
    const systemStatusText = document.getElementById('status-text');
    const activeUserBox = document.getElementById('user-box');
    const activeSpeakersContainer = document.getElementById('active-users-container');

    connectButton.addEventListener('click', async () => {
        clientNickname = nameInputField.value.trim();
        if (!clientNickname) {
            alert("Please type a nickname first!");
            return;
        }
        
        interfaceSetupArea.style.display = "none";
        systemStatusText.style.display = "block";
        systemStatusText.innerText = "Initializing system channels...";

        try {
            // Native microhpone streaming capture block
            localAudioStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                video: false
            });

            // Prevent naming collisions on standard networks
            const personalClientId = MASTER_ROOM_KEY + "_" + Math.floor(10000 + Math.random() * 90000);
            networkingPeer = new Peer(personalClientId);

            networkingPeer.on('open', () => {
                systemStatusText.innerText = "Voice lobby active!";
                systemStatusText.className = "status connected";
                activeUserBox.style.display = "block";
                renderSpeakerName(clientNickname, 'self');

                // Auto-route target to primary channel host
                const hostIdentity = MASTER_ROOM_KEY + "_host";
                if (personalClientId !== hostIdentity) {
                    const outgoingCallObject = networkingPeer.call(hostIdentity, localAudioStream, { metadata: { name: clientNickname } });
                    if (outgoingCallObject) bindAudioStreamEvents(outgoingCallObject);
                }
            });

            networkingPeer.on('call', (incomingCallObject) => {
                incomingCallObject.answer(localAudioStream);
                bindAudioStreamEvents(incomingCallObject);
            });

            // Setup independent listener node loop execution
            try {
                const independentLobbyNode = new Peer(MASTER_ROOM_KEY + "_host");
                independentLobbyNode.on('call', (incomingCallObject) => {
                    incomingCallObject.answer(localAudioStream);
                    bindAudioStreamEvents(incomingCallObject);
                });
            } catch(nodeConflictError) {}

        } catch (deviceStreamError) {
            systemStatusText.innerText = "Microphone configuration successful. Please refresh to start server.";
            interfaceSetupArea.style.display = "block";
            console.error(deviceStreamError);
        }
    });

    function bindAudioStreamEvents(callInstance) {
        const structuralName = callInstance.metadata && callInstance.metadata.name ? callInstance.metadata.name : "Active Speaker";
        
        callInstance.on('stream', (incomingMediaTrack) => {
            if (document.getElementById("audio_" + callInstance.peer)) return;
            renderSpeakerName(structuralName, callInstance.peer);
            
            const nativeAudioTag = document.createElement('audio');
            nativeAudioTag.id = "audio_" + callInstance.peer;
            nativeAudioTag.srcObject = incomingMediaTrack;
            nativeAudioTag.autoplay = true;
            nativeAudioTag.playsInline = true;
            document.body.appendChild(nativeAudioTag);
            nativeAudioTag.play().catch(playError => console.log("Stream successfully mounted to hardware engine"));
        });
        
        callInstance.on('close', () => cleanSpeakerName(callInstance.peer));
    }

    function renderSpeakerName(nameString, networkId) {
        if (document.getElementById("user_" + networkId)) return;
        const listDivElement = document.createElement('div');
        listDivElement.className = "user-item";
        listDivElement.id = "user_" + networkId;
        listDivElement.innerText = nameString + (networkId === "self" ? " (You)" : "");
        activeSpeakersContainer.appendChild(listDivElement);
    }

    function cleanSpeakerName(networkId) {
        const domTextLabel = document.getElementById("user_" + networkId);
        if (domTextLabel) domTextLabel.remove();
        const domAudioTrack = document.getElementById("audio_" + networkId);
        if (domAudioTrack) domAudioTrack.remove();
    }
</script>

</body>
</html>
