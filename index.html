<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Voice Room - Discord Style</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
<style>
:root {
  --bg: #313338;
  --side: #2b2d31;
  --dark: #1e1f22;
  --blue: #5865f2;
  --green: #23a559;
  --red: #ed4245;
  --text: #f2f3f5;
  --muted: #b5bac1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "gg sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== LOGIN ========== */
#login {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--dark);
  padding: 16px;
}
.card {
  background: var(--side);
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  padding: 28px 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.card h1 {
  text-align: center;
  font-size: 24px;
  color: #fff;
  margin-bottom: 6px;
}
.card .sub {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}
.modes {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.modes button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  background: var(--dark);
  color: var(--text);
}
.modes button.on {
  background: var(--blue);
  color: #fff;
}
.avatar-box {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--blue);
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #fff;
  overflow: hidden;
  position: relative;
  border: 3px solid #3f4147;
}
.avatar-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar-box input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 15px;
  margin-bottom: 12px;
}
input:focus { outline: 2px solid var(--blue); }
.join-btn {
  width: 100%;
  padding: 13px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.join-btn:active { background: #4752c4; }
.hint {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  line-height: 1.4;
}

/* ========== ROOM ========== */
#room {
  display: none;
  flex-direction: column;
  height: 100%;
}
.topbar {
  height: 48px;
  background: var(--side);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #1a1b1e;
  flex-shrink: 0;
}
.topbar .title {
  font-weight: 600;
  font-size: 15px;
  color: #fff;
}
.topbar .online {
  font-size: 13px;
  color: var(--muted);
}
#members {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  align-content: start;
}
.member {
  background: var(--side);
  border-radius: 10px;
  padding: 14px 10px;
  text-align: center;
  transition: box-shadow 0.15s ease;
  position: relative;
}
.member.speaking {
  box-shadow: 0 0 0 3px var(--green);
}
.member .pic {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--blue);
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
  position: relative;
}
.member .pic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.member .pic .emoji {
  position: absolute;
  bottom: -3px;
  right: -3px;
  font-size: 18px;
  background: var(--side);
  border-radius: 50%;
  line-height: 1;
  padding: 2px;
}
.member .name {
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.member .you {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.member .vol {
  margin-top: 8px;
}
.member .vol input[type=range] {
  width: 90px;
  accent-color: var(--blue);
}

/* Bottom bar */
.bottom {
  background: var(--side);
  padding: 10px 10px 20px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid #1a1b1e;
  flex-shrink: 0;
}
.bottom button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: #1e1f22;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bottom button:active { background: #3f4147; }
.bottom button.danger { background: var(--red); }
.bottom button.active { background: var(--red); }

.room-code {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  padding: 4px 0 2px;
  background: var(--side);
}

/* Panels */
.panel {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 90px;
  background: var(--side);
  border-radius: 12px;
  padding: 16px;
  z-index: 50;
  display: none;
  max-height: 55vh;
  overflow-y: auto;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
}
.panel h3 {
  font-size: 15px;
  color: #fff;
  margin-bottom: 12px;
}
.panel .grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.panel .grid button {
  padding: 11px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}
.panel .grid button.sel { background: var(--blue); }
.panel input[type=text] {
  width: 100%;
  padding: 10px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  margin-bottom: 8px;
}
.panel .close {
  margin-top: 10px;
  width: 100%;
  padding: 11px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.88);
  color: #fff;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
  z-index: 60;
  white-space: nowrap;
}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login">
  <div class="card">
    <h1>Voice Room</h1>
    <div class="sub">Enter name & photo, then join</div>

    <div class="modes">
      <button id="btnPeer" class="on">Unlimited</button>
      <button id="btnLive">LiveKit</button>
    </div>

    <div class="avatar-box" id="avatarBox">
      <span id="avatarLetter">?</span>
      <input type="file" id="photoInput" accept="image/*" />
    </div>

    <input type="text" id="nameInput" placeholder="Display name" maxlength="20" autocomplete="off" />
    <button class="join-btn" id="joinBtn">Join Voice Room</button>
    <div class="hint" id="modeHint">
      Unlimited mode uses room code <b>ffmic</b><br>
      First person becomes Host
    </div>
  </div>
</div>

<!-- ==================== ROOM ==================== -->
<div id="room">
  <div class="topbar">
    <div class="title" id="roomTitle">Voice Room</div>
    <div class="online" id="onlineCount">0 online</div>
  </div>

  <div id="members"></div>

  <div class="room-code" id="roomCodeText"></div>

  <div class="bottom">
    <button id="btnMute" title="Mute">🎤</button>
    <button id="btnDeafen" title="Deafen">🔊</button>
    <button id="btnEmoji" title="Emoji">😀</button>
    <button id="btnVoice" title="Voice Changer">🎙️</button>
    <button id="btnSound" title="Play Sound">🎵</button>
    <button id="btnEdit" title="Edit Profile">✏️</button>
    <button id="btnLeave" class="danger" title="Leave">✖</button>
  </div>
</div>

<!-- Voice Changer Panel -->
<div class="panel" id="voicePanel">
  <h3>Voice Changer</h3>
  <div class="grid" id="voiceGrid"></div>
  <button class="close" id="closeVoice">Close</button>
</div>

<!-- Soundboard Panel -->
<div class="panel" id="soundPanel">
  <h3>Play Meme / Sound</h3>
  <input type="text" id="soundUrl" placeholder="Paste mp3 / ogg link here" />
  <button class="close" id="playSoundBtn">Play Sound</button>
  <button class="close" id="closeSound">Close</button>
</div>

<!-- Edit Profile Panel -->
<div class="panel" id="editPanel">
  <h3>Edit Profile</h3>
  <input type="text" id="editName" placeholder="New name" maxlength="20" />
  <input type="file" id="editPhoto" accept="image/*" style="margin-bottom:10px;color:var(--muted)" />
  <button class="close" id="saveEdit">Save Changes</button>
  <button class="close" id="closeEdit">Cancel</button>
</div>

<!-- Emoji Panel -->
<div class="panel" id="emojiPanel">
  <h3>React with Emoji</h3>
  <div class="grid" id="emojiGrid"></div>
  <button class="close" id="closeEmoji">Close</button>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================================================
// CONFIG
// =====================================================
const LIVEKIT_URL = "wss://ffmic-43kbick8.livekit.cloud";
const TOKEN_URL   = "https://ffmic.mdxnirob.workers.dev/";
const LIVEKIT_ROOM = "main-room";
const PEER_HOST_ID = "ffmic-host";          // fixed host ID for Unlimited room
const PEER_ROOM_CODE = "ffmic";

const ICE_SERVERS = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:free.expressturn.com:3478",
      username: "000000002106201354",
      credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
    }
  ]
};

const VOICE_PRESETS = [
  { name: "Normal", pitch: 1.0 },
  { name: "Kid", pitch: 1.55 },
  { name: "Boy", pitch: 1.25 },
  { name: "Girl", pitch: 1.4 },
  { name: "Adult Male", pitch: 0.82 },
  { name: "Adult Female", pitch: 1.18 },
  { name: "Deep", pitch: 0.68 },
  { name: "Helium", pitch: 1.7 },
  { name: "Monster", pitch: 0.5 },
  { name: "Chipmunk", pitch: 1.85 },
  { name: "Robot", pitch: 1.0 },
  { name: "Radio", pitch: 0.95 }
];

const EMOJI_LIST = ["😀","😂","🤣","❤️","🔥","👍","👎","😮","😢","😡","🎉","💀","✨","👏","🙏","💯"];

// =====================================================
// STATE
// =====================================================
let currentMode = "peer";                 // "peer" | "live"
let myName = localStorage.getItem("vr_name") || "";
let myAvatar = localStorage.getItem("vr_avatar") || "";
let localStream = null;
let isMuted = false;
let isDeafened = false;
let currentEmoji = "";
let peer = null;
let livekitRoom = null;
let peerCalls = {};
let isHost = false;

// =====================================================
// DOM
// =====================================================
const loginEl = document.getElementById("login");
const roomEl = document.getElementById("room");
const nameInput = document.getElementById("nameInput");
const photoInput = document.getElementById("photoInput");
const avatarBox = document.getElementById("avatarBox");
const joinBtn = document.getElementById("joinBtn");
const btnPeer = document.getElementById("btnPeer");
const btnLive = document.getElementById("btnLive");
const modeHint = document.getElementById("modeHint");
const membersEl = document.getElementById("members");
const roomTitle = document.getElementById("roomTitle");
const onlineCount = document.getElementById("onlineCount");
const roomCodeText = document.getElementById("roomCodeText");
const btnMute = document.getElementById("btnMute");
const btnDeafen = document.getElementById("btnDeafen");
const btnEmoji = document.getElementById("btnEmoji");
const btnVoice = document.getElementById("btnVoice");
const btnSound = document.getElementById("btnSound");
const btnEdit = document.getElementById("btnEdit");
const btnLeave = document.getElementById("btnLeave");
const toastEl = document.getElementById("toast");

// Panels
const voicePanel = document.getElementById("voicePanel");
const soundPanel = document.getElementById("soundPanel");
const editPanel = document.getElementById("editPanel");
const emojiPanel = document.getElementById("emojiPanel");

// Prefill
if (myName) nameInput.value = myName;
if (myAvatar) {
  avatarBox.innerHTML = `<img src="${myAvatar}"><input type="file" id="photoInput" accept="image/*">`;
  document.getElementById("photoInput").onchange = handlePhoto;
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    myAvatar = reader.result;
    localStorage.setItem("vr_avatar", myAvatar);
    avatarBox.innerHTML = `<img src="${myAvatar}"><input type="file" id="photoInput" accept="image/*">`;
    document.getElementById("photoInput").onchange = handlePhoto;
  };
  reader.readAsDataURL(file);
}

// Mode switch
btnPeer.onclick = () => {
  currentMode = "peer";
  btnPeer.classList.add("on");
  btnLive.classList.remove("on");
  modeHint.innerHTML = "Unlimited mode uses room code <b>ffmic</b><br>First person becomes Host";
};
btnLive.onclick = () => {
  currentMode = "live";
  btnLive.classList.add("on");
  btnPeer.classList.remove("on");
  modeHint.textContent = "LiveKit mode – more stable for multiple people";
};

// Build voice buttons
VOICE_PRESETS.forEach((p, i) => {
  const btn = document.createElement("button");
  btn.textContent = p.name;
  if (i === 0) btn.classList.add("sel");
  btn.onclick = () => {
    document.querySelectorAll("#voiceGrid button").forEach(b => b.classList.remove("sel"));
    btn.classList.add("sel");
    showToast("Voice: " + p.name);
  };
  document.getElementById("voiceGrid").appendChild(btn);
});

// Build emoji buttons
EMOJI_LIST.forEach(em => {
  const btn = document.createElement("button");
  btn.textContent = em;
  btn.style.fontSize = "20px";
  btn.onclick = () => {
    currentEmoji = em;
    showToast(em);
    renderMembers();
    setTimeout(() => {
      currentEmoji = "";
      renderMembers();
    }, 3000);
    emojiPanel.style.display = "none";
  };
  document.getElementById("emojiGrid").appendChild(btn);
});

// Button events
joinBtn.onclick = joinRoom;
btnMute.onclick = toggleMute;
btnDeafen.onclick = toggleDeafen;
btnEmoji.onclick = () => { closeAllPanels(); emojiPanel.style.display = "block"; };
btnVoice.onclick = () => { closeAllPanels(); voicePanel.style.display = "block"; };
btnSound.onclick = () => { closeAllPanels(); soundPanel.style.display = "block"; };
btnEdit.onclick = () => {
  closeAllPanels();
  document.getElementById("editName").value = myName;
  editPanel.style.display = "block";
};
btnLeave.onclick = leaveRoom;

document.getElementById("closeVoice").onclick = () => voicePanel.style.display = "none";
document.getElementById("closeSound").onclick = () => soundPanel.style.display = "none";
document.getElementById("closeEdit").onclick = () => editPanel.style.display = "none";
document.getElementById("closeEmoji").onclick = () => emojiPanel.style.display = "none";

document.getElementById("playSoundBtn").onclick = () => {
  const url = document.getElementById("soundUrl").value.trim();
  if (!url) return showToast("Paste a link first");
  const audio = new Audio(url);
  audio.play().then(() => showToast("Playing...")).catch(() => showToast("Cannot play this link"));
};

document.getElementById("saveEdit").onclick = () => {
  const newName = document.getElementById("editName").value.trim();
  if (newName) {
    myName = newName;
    localStorage.setItem("vr_name", myName);
  }
  const file = document.getElementById("editPhoto").files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = () => {
      myAvatar = reader.result;
      localStorage.setItem("vr_avatar", myAvatar);
      renderMembers();
    };
    reader.readAsDataURL(file);
  } else {
    renderMembers();
  }
  editPanel.style.display = "none";
  showToast("Profile updated");
};

function closeAllPanels() {
  voicePanel.style.display = "none";
  soundPanel.style.display = "none";
  editPanel.style.display = "none";
  emojiPanel.style.display = "none";
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  setTimeout(() => toastEl.style.display = "none", 2200);
}

// =====================================================
// JOIN
// =====================================================
async function joinRoom() {
  myName = (nameInput.value || "").trim() || "Guest";
  localStorage.setItem("vr_name", myName);

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      },
      video: false
    });
  } catch (err) {
    alert("Please allow microphone access");
    return;
  }

  loginEl.style.display = "none";
  roomEl.style.display = "flex";
  roomTitle.textContent = currentMode === "peer" ? "Unlimited Room" : "LiveKit Room";
  roomCodeText.textContent = currentMode === "peer" ? "Room code: ffmic" : "";

  if (currentMode === "peer") {
    startPeerJS();
  } else {
    startLiveKit();
  }
}

// =====================================================
// PEERJS - FIXED ROOM "ffmic"
// =====================================================
function startPeerJS() {
  // Try to become host first
  peer = new Peer(PEER_HOST_ID, {
    config: ICE_SERVERS,
    debug: 1
  });

  peer.on("open", (id) => {
    isHost = true;
    console.log("Became HOST:", id);
    showToast("You are the Host of ffmic");
    renderMembers();
  });

  peer.on("call", (call) => {
    call.answer(localStream);
    handlePeerCall(call);
  });

  peer.on("connection", (conn) => {
    conn.on("data", (data) => {
      if (data && data.type === "join") {
        // Host calls the new client
        const call = peer.call(data.peerId, localStream);
        if (call) handlePeerCall(call);
      }
    });
  });

  peer.on("error", (err) => {
    if (err.type === "unavailable-id") {
      // Host already exists → join as client
      joinAsClient();
    } else {
      console.error(err);
      showToast("Peer error: " + err.type);
    }
  });
}

function joinAsClient() {
  peer = new Peer({
    config: ICE_SERVERS,
    debug: 1
  });

  peer.on("open", (id) => {
    isHost = false;
    console.log("Joined as client:", id);
    showToast("Joined room ffmic");

    // Call the host
    const call = peer.call(PEER_HOST_ID, localStream);
    if (call) handlePeerCall(call);

    // Notify host via data channel
    const conn = peer.connect(PEER_HOST_ID);
    conn.on("open", () => {
      conn.send({ type: "join", peerId: id, name: myName });
    });

    renderMembers();
  });

  peer.on("call", (call) => {
    call.answer(localStream);
    handlePeerCall(call);
  });

  peer.on("error", (err) => {
    console.error(err);
    showToast("Connection error");
  });
}

function handlePeerCall(call) {
  peerCalls[call.peer] = call;

  call.on("stream", (remoteStream) => {
    playRemoteAudio(call.peer, remoteStream);
    renderMembers();
  });

  call.on("close", () => {
    delete peerCalls[call.peer];
    const audio = document.getElementById("audio-" + call.peer);
    if (audio) audio.remove();
    renderMembers();
  });

  call.on("error", () => {
    delete peerCalls[call.peer];
    renderMembers();
  });
}

function renderMembers() {
  // Used by both modes
  if (currentMode === "peer") {
    renderPeerMembers();
  } else if (livekitRoom) {
    renderLiveKitMembers();
  }
}

function renderPeerMembers() {
  membersEl.innerHTML = "";

  // Local user
  const localCard = createMemberCard(myName, true, myAvatar, currentEmoji);
  membersEl.appendChild(localCard);

  // Remote peers
  Object.keys(peerCalls).forEach((pid) => {
    const card = createMemberCard("User", false, null, "");
    card.id = "member-" + pid;
    membersEl.appendChild(card);
  });

  onlineCount.textContent = (1 + Object.keys(peerCalls).length) + " online";
}

// =====================================================
// LIVEKIT
// =====================================================
async function startLiveKit() {
  try {
    const url = TOKEN_URL + "?name=" + encodeURIComponent(myName) + "&room=" + LIVEKIT_ROOM;
    const res = await fetch(url);
    const text = await res.text();

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error("Token server returned invalid data");
    }
    if (!data.token) throw new Error("No token received");

    livekitRoom = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });

    livekitRoom.on(LivekitClient.RoomEvent.ParticipantConnected, renderLiveKitMembers);
    livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, renderLiveKitMembers);

    livekitRoom.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      document.querySelectorAll(".member").forEach(el => el.classList.remove("speaking"));
      speakers.forEach(s => {
        const el = document.getElementById("member-" + s.identity);
        if (el) el.classList.add("speaking");
      });
    });

    livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
      if (track.kind === "audio") {
        const el = track.attach();
        el.id = "audio-" + participant.identity;
        el.autoplay = true;
        document.body.appendChild(el);
      }
    });

    await livekitRoom.connect(LIVEKIT_URL, data.token);
    await livekitRoom.localParticipant.setMicrophoneEnabled(true);

    renderLiveKitMembers();
    showToast("Connected to LiveKit");
  } catch (err) {
    console.error(err);
    alert("LiveKit connection failed:\n" + err.message);
    leaveRoom();
  }
}

function renderLiveKitMembers() {
  if (!livekitRoom) return;
  membersEl.innerHTML = "";

  const all = [livekitRoom.localParticipant, ...Array.from(livekitRoom.remoteParticipants.values())];
  onlineCount.textContent = all.length + " online";

  all.forEach(p => {
    const isLocal = p === livekitRoom.localParticipant;
    const name = isLocal ? myName : (p.name || p.identity);
    const avatar = isLocal ? myAvatar : null;
    const emoji = isLocal ? currentEmoji : "";

    const card = createMemberCard(name, isLocal, avatar, emoji);
    card.id = "member-" + p.identity;

    // Volume slider for remote users
    if (!isLocal) {
      const volDiv = document.createElement("div");
      volDiv.className = "vol";
      volDiv.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
      volDiv.querySelector("input").oninput = (e) => {
        const audio = document.getElementById("audio-" + p.identity);
        if (audio) audio.volume = parseFloat(e.target.value);
      };
      card.appendChild(volDiv);
    }

    membersEl.appendChild(card);
  });
}

// =====================================================
// HELPERS
// =====================================================
function createMemberCard(name, isLocal, avatarUrl, emoji) {
  const div = document.createElement("div");
  div.className = "member";

  const initial = (name || "?").charAt(0).toUpperCase();
  let picContent = initial;
  if (avatarUrl) {
    picContent = `<img src="${avatarUrl}" alt="">`;
  }

  div.innerHTML = `
    <div class="pic">
      ${picContent}
      <span class="emoji">${emoji || ""}</span>
    </div>
    <div class="name">${name}</div>
    ${isLocal ? '<div class="you">you</div>' : ''}
  `;
  return div;
}

function playRemoteAudio(id, stream) {
  let audio = document.getElementById("audio-" + id);
  if (!audio) {
    audio = document.createElement("audio");
    audio.id = "audio-" + id;
    audio.autoplay = true;
    document.body.appendChild(audio);
  }
  audio.srcObject = stream;
}

function toggleMute() {
  isMuted = !isMuted;
  if (localStream) {
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  }
  if (livekitRoom) {
    livekitRoom.localParticipant.setMicrophoneEnabled(!isMuted);
  }
  btnMute.classList.toggle("active", isMuted);
  btnMute.textContent = isMuted ? "🔇" : "🎤";
  showToast(isMuted ? "Microphone muted" : "Microphone unmuted");
}

function toggleDeafen() {
  isDeafened = !isDeafened;
  document.querySelectorAll("audio").forEach(a => a.muted = isDeafened);
  btnDeafen.classList.toggle("active", isDeafened);
  btnDeafen.textContent = isDeafened ? "🔇" : "🔊";
  showToast(isDeafened ? "Deafened" : "Undeafened");
}

function leaveRoom() {
  if (peer) {
    peer.destroy();
    peer = null;
  }
  if (livekitRoom) {
    livekitRoom.disconnect();
    livekitRoom = null;
  }
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  document.querySelectorAll("audio").forEach(a => a.remove());
  location.reload();
}
</script>
