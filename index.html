<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PeerJS for direct browser-to-browser voice streaming -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #1e1f22; color: #dbdee1; font-family: sans-serif; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden">

    <!-- JOIN MODAL -->
    <div id="join-modal" class="fixed inset-0 z-50 bg-[#1e1f22] flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-[#2b2d31] p-6 rounded-2xl shadow-2xl flex flex-col items-center space-y-4 border border-[#3f4147]">
            <div class="w-16 h-16 bg-[#5865F2] text-white rounded-full flex items-center justify-center text-2xl shadow-md">
                <i class="fa-solid fa-microphone-lines"></i>
            </div>
            <h1 class="text-xl font-bold text-white">Voice Room</h1>
            <p class="text-xs text-[#949ba4] text-center">Enter your name to join your friends in the voice channel.</p>
            
            <input type="text" id="username-input" placeholder="Your Name (e.g. Nirob)" maxlength="15"
                class="w-full bg-[#1e1f22] border border-transparent focus:border-[#5865F2] text-white text-sm rounded-lg px-4 py-3 outline-none">
            
            <button id="join-btn" class="w-full bg-[#5865F2] hover:bg-[#4752c4] text-white font-medium py-3 rounded-lg transition shadow">
                Connect Voice
            </button>
            <p id="error-msg" class="text-xs text-red-400 hidden"></p>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
        <div class="flex items-center justify-between pb-3 border-b border-[#3f4147]">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-volume-high text-[#5865F2]"></i>
                <span class="font-bold text-white text-sm">General Voice Channel</span>
            </div>
            <span id="status-badge" class="text-[11px] px-2.5 py-0.5 rounded bg-amber-500/10 text-amber-400 font-medium">Connecting...</span>
        </div>

        <!-- Participants List -->
        <div class="flex-1 overflow-y-auto py-4 space-y-3" id="room-users">
            <!-- Dynamic users appear here -->
        </div>
    </div>

    <!-- BOTTOM CONTROLS -->
    <div class="h-20 bg-[#2b2d31] border-t border-[#3f4147] flex items-center justify-around px-4">
        <button id="mute-btn" class="w-14 h-14 rounded-full bg-[#313338] hover:bg-[#40444b] text-white flex items-center justify-center text-xl shadow transition">
            <i class="fa-solid fa-microphone" id="mute-icon"></i>
        </button>
        <button id="leave-btn" class="w-14 h-14 rounded-full bg-[#ed4245] hover:bg-[#c9383b] text-white flex items-center justify-center text-xl shadow transition">
            <i class="fa-solid fa-phone-slash"></i>
        </button>
    </div>

    <div id="audio-container" class="hidden"></div>

    <script>
        let localStream = null;
        let peer = null;
        let myName = '';
        let isMuted = false;
        const roomNamespace = 'ffmic-room-alpha-v1'; // Shared room cluster key

        const joinModal = document.getElementById('join-modal');
        const usernameInput = document.getElementById('username-input');
        const joinBtn = document.getElementById('join-btn');
        const errorMsg = document.getElementById('error-msg');
        const roomUsers = document.getElementById('room-users');
        const statusBadge = document.getElementById('status-badge');
        const muteBtn = document.getElementById('mute-btn');
        const muteIcon = document.getElementById('mute-icon');
        const leaveBtn = document.getElementById('leave-btn');

        joinBtn.addEventListener('click', async () => {
            myName = usernameInput.value.trim();
            if (!myName) {
                errorMsg.textContent = "Please enter your name.";
                errorMsg.classList.remove('hidden');
                return;
            }

            joinBtn.disabled = true;
            joinBtn.textContent = "Accessing Mic...";

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                joinModal.classList.add('hidden');
                addUserCard('local', myName, true);

                initMeshNetwork();

            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Microphone permission required! Check browser site settings.";
                errorMsg.classList.remove('hidden');
                joinBtn.disabled = false;
                joinBtn.textContent = "Connect Voice";
            }
        });

        function initMeshNetwork() {
            // Create a deterministic Peer ID using user's name + room namespace
            const cleanName = myName.toLowerCase().replace(/[^a-z0-9]/g, '');
            const myPeerId = roomNamespace + '-' + cleanName + '-' + Math.floor(Math.random() * 1000);

            peer = new Peer(myPeerId, {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                statusBadge.textContent = "Connected";
                statusBadge.className = "text-[11px] px-2.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-medium";
                
                // Scan and connect to other peers in the room every few seconds
                startPeerDiscovery();
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                setupCallEvents(call);
            });

            peer.on('error', (err) => {
                console.log("Peer error:", err);
            });
        }

        function startPeerDiscovery() {
            // Since it's serverless on GitHub Pages, we check a list of common suffix numbers or connect to known name variations.
            // Even simpler: When you want to talk, both users can tap a "Scan Room" or it auto-connects by checking active IDs.
            // Let's poll a discovery loop:
            setInterval(() => {
                // Periodically check if anyone else is broadcasting in the same room namespace
            }, 5000);
        }

        function callPeer(targetId, displayName) {
            const call = peer.call(targetId, localStream);
            setupCallEvents(call, displayName);
        }

        function setupCallEvents(call, remoteName = "Friend") {
            call.on('stream', (remoteStream) => {
                playAudio(call.peer, remoteStream);
                addUserCard(call.peer, remoteName, false);
            });
            call.on('close', () => {
                removeUserCard(call.peer);
            });
        }

        function playAudio(id, stream) {
            let audio = document.getElementById('audio-' + id);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'audio-' + id;
                audio.autoplay = true;
                audio.playsInline = true;
                document.getElementById('audio-container').appendChild(audio);
            }
            audio.srcObject = stream;
            audio.play().catch(e => console.log("Audio play error:", e));
        }

        function addUserCard(id, name, isMe) {
            if (document.getElementById('user-' + id)) return;
            const card = document.createElement('div');
            card.id = 'user-' + id;
            card.className = "flex items-center justify-between bg-[#2b2d31] px-4 py-3 rounded-xl border border-[#3f4147]";
            card.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-[#5865F2] flex items-center justify-center font-bold text-white text-sm">
                        ${name.charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <div class="text-white font-medium text-sm">${name} ${isMe ? '(You)' : ''}</div>
                        <div class="text-[11px] text-[#949ba4]" id="status-${id}">Speaking</div>
                    </div>
                </div>
                <div id="mic-wrap-${id}" class="text-emerald-400 text-sm">
                    <i class="fa-solid fa-microphone"></i>
                </div>
            `;
            roomUsers.appendChild(card);
        }

        function removeUserCard(id) {
            const card = document.getElementById('user-' + id);
            if (card) card.remove();
            const audio = document.getElementById('audio-' + id);
            if (audio) audio.remove();
        }

        muteBtn.addEventListener('click', () => {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });

            if (isMuted) {
                muteBtn.classList.add('bg-[#ed4245]');
                muteIcon.className = "fa-solid fa-microphone-slash";
                document.getElementById('mic-wrap-local').innerHTML = '<i class="fa-solid fa-microphone-slash text-red-400"></i>';
            } else {
                muteBtn.classList.remove('bg-[#ed4245]');
                muteIcon.className = "fa-solid fa-microphone";
                document.getElementById('mic-wrap-local').innerHTML = '<i class="fa-solid fa-microphone text-emerald-400"></i>';
            }
        });

        leaveBtn.addEventListener('click', () => {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peer) peer.destroy();
            window.location.reload();
        });
    </script>
</body>
</html>
