<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceRoom</title>
    <!-- Premium, zero-configuration WebRTC Engine Library -->
    <script src="https://jit.si"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1118;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b26;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #5865F2; font-size: 28px; letter-spacing: 0.5px; }
        p { color: #a3a6ac; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            color: #a3a6ac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #202635;
            border: 1px solid #2d3548;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: #5865F2; }

        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background-color: #4752c4; }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #00fa9a;
            font-weight: bold;
        }
        
        /* Hidden layout area for background voice engine processing */
        #meet-channel-container {
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>VoiceRoom</h1>
    <p>Enter your nickname to join the permanent global voice stream instantly.</p>
    
    <div id="setup-area">
        <div class="input-group">
            <label for="username">Your Nickname</label>
            <input type="text" id="username" placeholder="e.g., Nirob" autocomplete="off">
        </div>
        <button class="btn" id="join-btn">Connect to VoiceRoom</button>
    </div>

    <div class="status" id="status-text" style="display: none;">Connecting to voice network...</div>
</div>

<!-- Background container for the voice stream bridge logic -->
<div id="meet-channel-container"></div>

<script>
    // Completely unblocked, locked global channel signature name
    const FIXED_ROOM_NAME = "Nirob_Secure_Production_VoiceRoom_Channel";
    
    const joinBtn = document.getElementById('join-btn');
    const usernameInput = document.getElementById('username');
    const setupArea = document.getElementById('setup-area');
    const statusText = document.getElementById('status-text');

    joinBtn.addEventListener('click', () => {
        const nickname = usernameInput.value.trim();
        if (!nickname) {
            alert("Please type a nickname first!");
            return;
        }
        
        setupArea.style.display = "none";
        statusText.style.display = "block";
        statusText.innerText = "Connecting to VoiceRoom network...";
        
        // Execute premium cloud communication bridge configurations
        try {
            const domain = "meet.jit.si";
            const options = {
                roomName: FIXED_ROOM_NAME,
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#meet-channel-container'),
                userInfo: {
                    displayName: nickname
                },
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false,
                    videoQuality: { disabled: true },
                    enableLayerSuspension: true,
                    p2p: { enabled: true } // Forces instant zero-lag direct browser-to-browser streaming
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [],
                    SETTINGS_SECTIONS: []
                }
            };
            
            const api = new JitsiMeetExternalAPI(domain, options);
            
            api.addEventListener('videoConferenceJoined', () => {
                statusText.innerText = "Voice lobby active! Connected live.";
                statusText.style.color = "#00fa9a";
            });
            
            api.addEventListener('videoConferenceLeft', () => {
                statusText.innerText = "Disconnected.";
                statusText.style.color = "#ffaa00";
                setupArea.style.display = "block";
            });
            
        } catch (err) {
            statusText.innerText = "Network bridge configuration failure. Please reload.";
            statusText.style.color = "#ffaa00";
            setupArea.style.display = "block";
            console.error(err);
        }
    });
</script>

</body>
</html>
