<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Room</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #313338;
      --sidebar: #2b2d31;
      --dark: #1e1f22;
      --blurple: #5865f2;
      --green: #23a559;
      --red: #ed4245;
      --text: #f2f3f5;
      --muted: #b5bac1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* LOGIN */
    #login {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      padding: 20px;
    }
    .card {
      background: var(--sidebar);
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      padding: 28px 24px;
    }
    .card h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 4px;
      color: #fff;
    }
    .card .sub {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }
    .modes {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .modes button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: var(--dark);
      color: var(--text);
    }
    .modes button.on {
      background: var(--blurple);
      color: #fff;
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: var(--blurple);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--dark);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
    }
    .join {
      width: 100%;
      padding: 13px;
      background: var(--blurple);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .join:active { background: #4752c4; }
    .note {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* ROOM */
    #room {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    .top {
      height: 48px;
      background: var(--sidebar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #1a1b1e;
      flex-shrink: 0;
    }
    .top .name { font-weight: 600; font-size: 15px; }
    .top .count { font-size: 13px; color: var(--muted); }

    #list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      align-content: start;
    }
    .user {
      background: var(--sidebar);
      border-radius: 10px;
      padding: 16px 12px;
      text-align: center;
      transition: box-shadow 0.15s;
    }
    .user.talk {
      box-shadow: 0 0 0 3px var(--green);
    }
    .user .pic {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--blurple);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
    }
    .user .pic img { width: 100%; height: 100%; object-fit: cover; }
    .user .nm { font-size: 14px; font-weight: 500; }
    .user .tag { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .user .vol {
      margin-top: 8px;
    }
    .user .vol input {
      width: 90px;
    }

    /* Bottom controls - higher like Discord */
    .bar {
      background: var(--sidebar);
      padding: 12px 12px 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-shrink: 0;
      border-top: 1px solid #1a1b1e;
    }
    .bar button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: #1e1f22;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bar button:active { background: #3f4147; }
    .bar button.red { background: var(--red); }
    .bar button.on { background: var(--red); }

    /* Panels */
    .panel {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 90px;
      background: var(--sidebar);
      border-radius: 12px;
      padding: 16px;
      z-index: 40;
      display: none;
      max-height: 50vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .panel h3 {
      font-size: 14px;
      margin-bottom: 12px;
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .grid button {
      padding: 11px;
      background: var(--dark);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .grid button.sel { background: var(--blurple); }
    .panel .close {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background: var(--dark);
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login">
    <div class="card">
      <h1>Voice Room</h1>
      <div class="sub">Choose mode and join</div>

      <div class="modes">
        <button id="mPeer" class="on">Unlimited</button>
        <button id="mLive">LiveKit</button>
      </div>

      <div class="avatar" id="av">
        <span id="avText">?</span>
        <input type="file" id="photo" accept="image/*" />
      </div>

      <input type="text" id="name" placeholder="Your name" maxlength="20" />
      <button class="join" id="go">Join Room</button>
      <div class="note" id="note">Unlimited mode = PeerJS (no time limit)</div>
    </div>
  </div>

  <!-- ROOM -->
  <div id="room">
    <div class="top">
      <div class="name" id="title">Voice Room</div>
      <div class="count" id="count">0 online</div>
    </div>

    <div id="list"></div>

    <div class="bar">
      <button id="btnMute" title="Mute">🎤</button>
      <button id="btnDeafen" title="Deafen">🔊</button>
      <button id="btnCam" title="Camera">📷</button>
      <button id="btnVoice" title="Voice Changer">🎙️</button>
      <button id="btnLeave" class="red" title="Leave">✖</button>
    </div>
  </div>

  <!-- Voice Panel -->
  <div class="panel" id="voicePanel">
    <h3>Voice Changer</h3>
    <div class="grid" id="voices"></div>
    <button class="close" id="closeVoice">Close</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ================== CONFIG ==================
const LK_URL = "wss://ffmic-43kbick8.livekit.cloud";
const TOKEN = "https://ffmic.mdxnirob.workers.dev/";
const ROOM_NAME = "main-room";

const ICE = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:free.expressturn.com:3478",
      username: "000000002106201354",
      credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
    }
  ]
};

const VOICES = [
  { name: "Normal", pitch: 1.0 },
  { name: "Kid", pitch: 1.55 },
  { name: "Boy", pitch: 1.25 },
  { name: "Girl", pitch: 1.4 },
  { name: "Adult Male", pitch: 0.82 },
  { name: "Adult Female", pitch: 1.18 },
  { name: "Deep", pitch: 0.68 },
  { name: "Helium", pitch: 1.7 },
  { name: "Monster", pitch: 0.5 },
  { name: "Chipmunk", pitch: 1.85 }
];

// ================== STATE ==================
let mode = "peer";
let myName = localStorage.getItem("vr_name") || "";
let myAvatar = localStorage.getItem("vr_avatar") || "";
let stream = null;
let muted = false;
let deafened = false;
let camOn = false;
let peer = null;
let room = null;
let pitch = 1.0;

// ================== DOM ==================
const login = document.getElementById("login");
const roomEl = document.getElementById("room");
const nameIn = document.getElementById("name");
const photo = document.getElementById("photo");
const av = document.getElementById("av");
const avText = document.getElementById("avText");
const go = document.getElementById("go");
const mPeer = document.getElementById("mPeer");
const mLive = document.getElementById("mLive");
const note = document.getElementById("note");
const list = document.getElementById("list");
const title = document.getElementById("title");
const count = document.getElementById("count");
const btnMute = document.getElementById("btnMute");
const btnDeafen = document.getElementById("btnDeafen");
const btnCam = document.getElementById("btnCam");
const btnVoice = document.getElementById("btnVoice");
const btnLeave = document.getElementById("btnLeave");
const voicePanel = document.getElementById("voicePanel");
const voices = document.getElementById("voices");
const toast = document.getElementById("toast");

if (myName) nameIn.value = myName;
if (myAvatar) {
  av.innerHTML = `<img src="${myAvatar}"><input type="file" id="photo" accept="image/*">`;
  document.getElementById("photo").onchange = onPhoto;
}

function onPhoto(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    myAvatar = r.result;
    localStorage.setItem("vr_avatar", myAvatar);
    av.innerHTML = `<img src="${myAvatar}"><input type="file" id="photo" accept="image/*">`;
    document.getElementById("photo").onchange = onPhoto;
  };
  r.readAsDataURL(f);
}

// Mode buttons
mPeer.onclick = () => {
  mode = "peer";
  mPeer.classList.add("on");
  mLive.classList.remove("on");
  note.textContent = "Unlimited mode = PeerJS (no time limit)";
};
mLive.onclick = () => {
  mode = "live";
  mLive.classList.add("on");
  mPeer.classList.remove("on");
  note.textContent = "LiveKit = better quality & more stable";
};

// Voice buttons
VOICES.forEach((v, i) => {
  const b = document.createElement("button");
  b.textContent = v.name;
  if (i === 0) b.classList.add("sel");
  b.onclick = () => {
    document.querySelectorAll("#voices button").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    pitch = v.pitch;
    show("Voice: " + v.name);
  };
  voices.appendChild(b);
});

go.onclick = start;
btnMute.onclick = toggleMute;
btnDeafen.onclick = toggleDeafen;
btnCam.onclick = toggleCam;
btnVoice.onclick = () => {
  voicePanel.style.display = voicePanel.style.display === "block" ? "none" : "block";
};
document.getElementById("closeVoice").onclick = () => voicePanel.style.display = "none";
btnLeave.onclick = leave;

function show(msg) {
  toast.textContent = msg;
  toast.style.display = "block";
  setTimeout(() => toast.style.display = "none", 2000);
}

// ================== START ==================
async function start() {
  myName = (nameIn.value || "").trim() || "Guest";
  localStorage.setItem("vr_name", myName);

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false
    });
  } catch (e) {
    alert("Please allow microphone access");
    return;
  }

  login.style.display = "none";
  roomEl.style.display = "flex";
  title.textContent = mode === "peer" ? "Unlimited Room" : "LiveKit Room";

  if (mode === "live") {
    startLiveKit();
  } else {
    startPeer();
  }
}

// ================== LIVEKIT (most reliable) ==================
async function startLiveKit() {
  try {
    const res = await fetch(TOKEN + "?name=" + encodeURIComponent(myName) + "&room=" + ROOM_NAME);
    const txt = await res.text();
    let data;
    try { data = JSON.parse(txt); } catch (e) {
      throw new Error("Token server problem");
    }
    if (!data.token) throw new Error("No token received");

    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });

    room.on(LivekitClient.RoomEvent.ParticipantConnected, drawLive);
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, drawLive);
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      document.querySelectorAll(".user").forEach(u => u.classList.remove("talk"));
      speakers.forEach(s => {
        const el = document.getElementById("u-" + s.identity);
        if (el) el.classList.add("talk");
      });
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind === "audio") {
        const a = track.attach();
        a.id = "aud-" + p.identity;
        a.autoplay = true;
        document.body.appendChild(a);
      }
    });

    await room.connect(LK_URL, data.token);
    await room.localParticipant.setMicrophoneEnabled(true);
    drawLive();
    show("Connected to LiveKit");
  } catch (err) {
    alert("LiveKit error:\n" + err.message);
    leave();
  }
}

function drawLive() {
  if (!room) return;
  list.innerHTML = "";
  const people = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
  count.textContent = people.length + " online";

  people.forEach(p => {
    const local = p === room.localParticipant;
    const name = local ? myName : (p.name || p.identity);
    const div = makeUser(name, local, local ? myAvatar : null);
    div.id = "u-" + p.identity;

    if (!local) {
      const vol = document.createElement("div");
      vol.className = "vol";
      vol.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
      vol.querySelector("input").oninput = (e) => {
        const a = document.getElementById("aud-" + p.identity);
        if (a) a.volume = parseFloat(e.target.value);
      };
      div.appendChild(vol);
    }
    list.appendChild(div);
  });
}

// ================== PEERJS ==================
function startPeer() {
  peer = new Peer({
    config: ICE,
    debug: 1
  });

  peer.on("open", (id) => {
    console.log("My ID:", id);
    drawPeer();
    show("Connected (Unlimited mode)");
  });

  peer.on("call", (call) => {
    call.answer(stream);
    call.on("stream", (remote) => {
      play(call.peer, remote);
      drawPeer();
    });
  });

  peer.on("error", (err) => {
    console.log(err);
    show("Peer error: " + err.type);
  });
}

function drawPeer() {
  list.innerHTML = "";
  const div = makeUser(myName, true, myAvatar);
  list.appendChild(div);
  count.textContent = "1 online";
}

function play(id, media) {
  let a = document.getElementById("aud-" + id);
  if (!a) {
    a = document.createElement("audio");
    a.id = "aud-" + id;
    a.autoplay = true;
    document.body.appendChild(a);
  }
  a.srcObject = media;
}

// ================== HELPERS ==================
function makeUser(name, isLocal, avatar) {
  const div = document.createElement("div");
  div.className = "user";
  const letter = (name || "?").charAt(0).toUpperCase();
  let pic = letter;
  if (avatar) pic = `<img src="${avatar}">`;
  div.innerHTML = `
    <div class="pic">${pic}</div>
    <div class="nm">${name}</div>
    ${isLocal ? '<div class="tag">you</div>' : ''}
  `;
  return div;
}

function toggleMute() {
  muted = !muted;
  if (stream) stream.getAudioTracks().forEach(t => t.enabled = !muted);
  if (room) room.localParticipant.setMicrophoneEnabled(!muted);
  btnMute.classList.toggle("on", muted);
  btnMute.textContent = muted ? "🔇" : "🎤";
  show(muted ? "Muted" : "Unmuted");
}

function toggleDeafen() {
  deafened = !deafened;
  document.querySelectorAll("audio").forEach(a => a.muted = deafened);
  btnDeafen.classList.toggle("on", deafened);
  btnDeafen.textContent = deafened ? "🔇" : "🔊";
  show(deafened ? "Deafened" : "Undeafened");
}

async function toggleCam() {
  if (!camOn) {
    try {
      const vs = await navigator.mediaDevices.getUserMedia({
        video: { width: 1280, height: 720 },
        audio: false
      });
      const track = vs.getVideoTracks()[0];
      if (room) {
        await room.localParticipant.publishTrack(track);
      }
      camOn = true;
      btnCam.classList.add("on");
      show("Camera On");
    } catch (e) {
      alert("Camera error: " + e.message);
    }
  } else {
    if (room) {
      room.localParticipant.videoTrackPublications.forEach(async (pub) => {
        if (pub.track) {
          await room.localParticipant.unpublishTrack(pub.track);
          pub.track.stop();
        }
      });
    }
    camOn = false;
    btnCam.classList.remove("on");
    show("Camera Off");
  }
}

function leave() {
  if (peer) peer.destroy();
  if (room) room.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.querySelectorAll("audio").forEach(a => a.remove());
  location.reload();
}
</script>
</body>
  </html>
