<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Simple Voice Room</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1f22;
      color: #dbdee1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
    .sub { font-size: 0.85rem; color: #949ba4; margin-bottom: 24px; text-align: center; }

    /* Name screen */
    #name-screen {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    #name-screen input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: #2b2d31;
      color: #fff;
      margin-bottom: 12px;
      outline: none;
    }
    #name-screen button, .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: #fff;
      cursor: pointer;
    }
    #name-screen button:active, .btn:active { background: #4752c4; }

    /* Main room */
    #room {
      display: none;
      width: 100%;
      max-width: 420px;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2b2d31;
      padding: 12px 16px;
      border-radius: 10px;
    }
    .header .name { font-weight: 600; color: #fff; }
    .header button {
      background: none;
      border: none;
      color: #949ba4;
      font-size: 0.9rem;
      cursor: pointer;
    }

    #participants {
      background: #2b2d31;
      border-radius: 10px;
      padding: 8px;
      min-height: 180px;
      max-height: 50vh;
      overflow-y: auto;
    }
    .person {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 4px;
    }
    .person.me { background: #3a3c42; }
    .person .left { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #5865f2;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; font-size: 0.95rem;
    }
    .person .name-text { font-weight: 500; }
    .person .you { font-size: 0.75rem; color: #949ba4; margin-left: 4px; }
    .mute-btn {
      background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 6px;
      opacity: 0.7;
    }
    .mute-btn.muted { opacity: 1; filter: grayscale(1); }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .controls .btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn.red { background: #ed4245; }
    .btn.red:active { background: #c93b3e; }
    .btn.gray { background: #4e5058; }
    .status {
      text-align: center;
      font-size: 0.85rem;
      color: #949ba4;
      min-height: 20px;
    }
    .status.connected { color: #23a559; }
  </style>
</head>
<body>

  <!-- Name screen -->
  <div id="name-screen">
    <h1>Voice Room</h1>
    <p class="sub">Enter a name to join the only room</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="20" autocomplete="off" />
    <button id="join-btn">Join Voice</button>
  </div>

  <!-- Main room -->
  <div id="room">
    <div class="header">
      <div>
        <span class="name" id="my-name-display"></span>
      </div>
      <button id="change-name-btn">Change name</button>
    </div>

    <div id="participants"></div>

    <div class="controls">
      <button class="btn gray" id="mute-self-btn">🔇 Mute</button>
      <button class="btn red" id="leave-btn">Leave</button>
    </div>

    <div class="status" id="status">Connecting…</div>
  </div>

<script>
  // ====== CONFIG ======
  const ROOM_ID = "express-voice-room-v1"; // The fixed ID for the room host
  
  // Using your ExpressTURN credentials
  const PEER_CONFIG = {
    config: {
      iceServers: [
        { urls: "stun:free.expressturn.com:3478" },
        { 
          urls: "turn:free.expressturn.com:3478",
          username: "000000002106201354",
          credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
        }
      ]
    }
  };

  // ====== STATE ======
  let myName = localStorage.getItem("voiceName") || "";
  let peer = null;
  let localStream = null;
  let isSelfMuted = false;
  let isHost = false;
  let hostConn = null;                 
  let connections = {};                
  let myPeerId = null;

  // Host State Variables
  let hostClients = []; 
  let hostPeerList = {}; 

  // ====== DOM ======
  const nameScreen = document.getElementById("name-screen");
  const roomEl = document.getElementById("room");
  const nameInput = document.getElementById("name-input");
  const joinBtn = document.getElementById("join-btn");
  const participantsEl = document.getElementById("participants");
  const myNameDisplay = document.getElementById("my-name-display");
  const changeNameBtn = document.getElementById("change-name-btn");
  const muteSelfBtn = document.getElementById("mute-self-btn");
  const leaveBtn = document.getElementById("leave-btn");
  const statusEl = document.getElementById("status");

  // ====== INIT ======
  if (myName) nameInput.value = myName;

  joinBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    if (!name) return nameInput.focus();
    myName = name;
    localStorage.setItem("voiceName", myName);
    start();
  });

  nameInput.addEventListener("keydown", e => {
    if (e.key === "Enter") joinBtn.click();
  });

  changeNameBtn.addEventListener("click", () => {
    const newName = prompt("New name:", myName);
    if (newName && newName.trim()) {
      myName = newName.trim().slice(0, 20);
      localStorage.setItem("voiceName", myName);
      myNameDisplay.textContent = myName;
      broadcastName();
      renderParticipants();
    }
  });

  muteSelfBtn.addEventListener("click", toggleSelfMute);
  leaveBtn.addEventListener("click", leaveRoom);

  // ====== START ======
  async function start() {
    if (window.location.protocol === 'file:') {
      alert("WARNING: Microphones do not work on local files. You must upload this to GitHub Pages!");
      return;
    }

    nameScreen.style.display = "none";
    roomEl.style.display = "flex";
    myNameDisplay.textContent = myName;
    statusEl.textContent = "Getting microphone…";

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 48000 }, 
          video: false 
      });
    } catch (err) {
      statusEl.textContent = "Microphone permission denied";
      alert("Please allow microphone access");
      return;
    }

    statusEl.textContent = "Connecting to network…";

    // Create our peer for making media calls
    peer = new Peer(PEER_CONFIG);

    peer.on("open", id => {
      myPeerId = id;
      tryJoinOrBecomeHost();
    });

    peer.on("error", err => {
      console.error(err);
      statusEl.textContent = "Connection error – try refresh";
    });

    peer.on("call", handleIncomingCall);
  }

  // ====== HOST / JOIN LOGIC ======
  function tryJoinOrBecomeHost() {
    statusEl.textContent = "Looking for room host...";
    
    // Attempt to connect to the fixed ROOM_ID
    const conn = peer.connect(ROOM_ID, { reliable: true });
    let joined = false;

    conn.on("open", () => {
      joined = true;
      isHost = false;
      hostConn = conn;
      statusEl.textContent = "Joined room";
      statusEl.classList.add("connected");

      // Tell host our media ID and name
      conn.send({ type: "join", id: myPeerId, name: myName });
    });

    conn.on("data", data => handleHostMessage(data));

    conn.on("close", () => {
      statusEl.textContent = "Host left – reconnecting...";
      statusEl.classList.remove("connected");
      
      // Clear everyone and try to form a new room after a random delay (prevents collisions)
      Object.keys(connections).forEach(removeRemote);
      setTimeout(tryJoinOrBecomeHost, Math.random() * 2000 + 500);
    });

    // If connection fails, we become the host
    setTimeout(() => {
      if (!joined) becomeHost();
    }, 2500);
  }

  // ---- HOST PROXY LOGIC ----
  function becomeHost() {
    isHost = true;
    statusEl.textContent = "You are the room host";
    statusEl.classList.add("connected");

    // Host needs a second peer instance claiming the specific ROOM_ID
    const hostPeer = new Peer(ROOM_ID, PEER_CONFIG);

    hostPeerList[myPeerId] = myName; // Add myself to the roster

    hostPeer.on("open", () => console.log("Created room successfully"));

    hostPeer.on("connection", conn => {
      conn.on("open", () => {
        
        conn.on("data", data => {
          if (data.type === "join") {
            hostClients.push(conn);
            hostPeerList[data.id] = data.name;

            // Send full list to the new user
            conn.send({ type: "list", list: hostPeerList });

            // Tell all other existing users about the new user
            hostClients.forEach(c => {
              if (c.peer !== conn.peer) {
                c.send({ type: "new", id: data.id, name: data.name });
              }
            });
          } 
          else if (data.type === "name") {
            hostPeerList[data.id] = data.name;
            hostClients.forEach(c => {
              if (c.peer !== conn.peer) c.send(data);
            });
          }
        });

      });

      conn.on("close", () => {
        // Find who disconnected based on their data connection ID
        const disconnectedId = Object.keys(hostPeerList).find(id => id !== myPeerId && !hostClients.some(c => c.peer === conn.peer));
        
        hostClients = hostClients.filter(c => c.peer !== conn.peer);
        
        if (disconnectedId) {
            delete hostPeerList[disconnectedId];
            hostClients.forEach(c => c.send({ type: "left", id: disconnectedId }));
        }
      });
    });

    hostPeer.on("error", err => {
      if (err.type === "unavailable-id") {
        setTimeout(tryJoinOrBecomeHost, 2000); // Someone beat us to it
      }
    });
  }

  // ---- CLIENT MESSAGE HANDLER ----
  function handleHostMessage(data) {
    if (data.type === "list") {
      Object.keys(data.list).forEach(id => {
        if (id !== myPeerId) {
          addRemote(id, data.list[id], null);
          callPeer(id); // Call everyone in the room
        }
      });
      renderParticipants();
    } 
    else if (data.type === "new") {
      if (data.id !== myPeerId) {
        addRemote(data.id, data.name, null);
        // We wait for them to call us to avoid double-calling
        renderParticipants();
      }
    } 
    else if (data.type === "name") {
      if (connections[data.id]) {
        connections[data.id].name = data.name;
        renderParticipants();
      }
    } 
    else if (data.type === "left") {
      removeRemote(data.id);
    }
  }

  // ====== MEDIA ======
  function callPeer(remoteId) {
    if (connections[remoteId] && connections[remoteId].mediaCall) return;
    const call = peer.call(remoteId, localStream);
    setupCall(call, remoteId);
  }

  function handleIncomingCall(call) {
    call.answer(localStream);
    setupCall(call, call.peer);
  }

  function setupCall(call, remoteId) {
    call.on("stream", remoteStream => {
      if (!connections[remoteId]) {
        addRemote(remoteId, "User", remoteStream);
      } else {
        connections[remoteId].stream = remoteStream;
      }

      let audio = connections[remoteId].audioEl;
      if (!audio) {
        audio = document.createElement("audio");
        audio.autoplay = true;
        document.body.appendChild(audio);
        connections[remoteId].audioEl = audio;
      }
      audio.srcObject = remoteStream;
      if (connections[remoteId].localMuted) audio.muted = true;
      
      renderParticipants();
    });

    call.on("close", () => removeRemote(remoteId));

    if (!connections[remoteId]) {
      connections[remoteId] = { mediaCall: call, name: "User", localMuted: false };
    } else {
      connections[remoteId].mediaCall = call;
    }
  }

  // ====== PARTICIPANTS UI ======
  function addRemote(id, name, stream) {
    if (connections[id]) {
      connections[id].name = name;
      return;
    }
    connections[id] = { name: name || "User", localMuted: false, stream: stream || null, audioEl: null, mediaCall: null };
  }

  function removeRemote(id) {
    if (!connections[id]) return;
    if (connections[id].audioEl) {
      connections[id].audioEl.srcObject = null;
      connections[id].audioEl.remove();
    }
    if (connections[id].mediaCall) connections[id].mediaCall.close();
    delete connections[id];
    renderParticipants();
  }

  function renderParticipants() {
    participantsEl.innerHTML = "";

    // Myself
    const meDiv = document.createElement("div");
    meDiv.className = "person me";
    meDiv.innerHTML = `
      <div class="left">
        <div class="avatar">${myName.charAt(0).toUpperCase()}</div>
        <div>
          <span class="name-text">${escapeHtml(myName)}</span>
          <span class="you">(you)</span>
        </div>
      </div>
      <button class="mute-btn ${isSelfMuted ? "muted" : ""}" onclick="toggleSelfMute()">
        ${isSelfMuted ? "🔇" : "🎤"}
      </button>
    `;
    participantsEl.appendChild(meDiv);

    // Others
    Object.keys(connections).forEach(id => {
      const p = connections[id];
      const div = document.createElement("div");
      div.className = "person";
      
      // FIXED TEMPLATE LITERAL SYNTAX HERE
      div.innerHTML = `
        <div class="left">
          <div class="avatar">${(p.name || "?").charAt(0).toUpperCase()}</div>
          <span class="name-text">${escapeHtml(p.name || "User")}</span>
        </div>
        <button class="mute-btn ${p.localMuted ? "muted" : ""}" onclick="toggleLocalMute('${id}')">
          ${p.localMuted ? "🔇" : "🔊"}
        </button>
      `;
      participantsEl.appendChild(div);
    });
  }

  // ====== CONTROLS ======
  function toggleSelfMute() {
    isSelfMuted = !isSelfMuted;
    if (localStream) {
      localStream.getAudioTracks().forEach(t => t.enabled = !isSelfMuted);
    }
    muteSelfBtn.textContent = isSelfMuted ? "🎤 Unmute" : "🔇 Mute";
    renderParticipants();
  }

  window.toggleSelfMute = toggleSelfMute;

  window.toggleLocalMute = function(id) {
    const p = connections[id];
    if (!p) return;
    p.localMuted = !p.localMuted;
    if (p.audioEl) p.audioEl.muted = p.localMuted;
    renderParticipants();
  };

  function broadcastName() {
    if (isHost) {
      hostPeerList[myPeerId] = myName;
      hostClients.forEach(c => c.send({ type: "name", id: myPeerId, name: myName }));
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: "name", id: myPeerId, name: myName });
    }
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function leaveRoom() {
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (peer) peer.destroy();
    Object.keys(connections).forEach(removeRemote);
    location.reload();
  }
</script>
</body>
</html>
