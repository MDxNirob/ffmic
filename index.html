<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Voice Room</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
<style>
:root {
  --bg:#313338; --side:#2b2d31; --dark:#1e1f22;
  --blue:#5865f2; --green:#23a559; --red:#ed4245;
  --text:#f2f3f5; --muted:#b5bac1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

#login{flex:1;display:flex;align-items:center;justify-content:center;background:var(--dark);padding:20px}
.card{background:var(--side);width:100%;max-width:400px;border-radius:12px;padding:26px 22px}
.card h1{text-align:center;font-size:22px;margin-bottom:4px}
.card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.modes{display:flex;gap:8px;margin-bottom:16px}
.modes button{flex:1;padding:11px;border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;background:var(--dark);color:var(--text)}
.modes button.on{background:var(--blue);color:#fff}
.av{width:80px;height:80px;border-radius:50%;background:var(--blue);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=text]{width:100%;padding:12px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:15px;margin-bottom:12px}
.btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
.note{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}

#room{display:none;flex-direction:column;height:100vh}
.top{height:48px;background:var(--side);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #1a1b1e;flex-shrink:0}
.top .t{font-weight:600;font-size:15px}
.top .c{font-size:13px;color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;align-content:start}
.user{background:var(--side);border-radius:10px;padding:14px 10px;text-align:center;transition:box-shadow .15s}
.user.talk{box-shadow:0 0 0 3px var(--green)}
.pic{width:60px;height:60px;border-radius:50%;background:var(--blue);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;color:#fff;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.nm{font-size:13px;font-weight:500}
.tag{font-size:11px;color:var(--muted)}
.vol{margin-top:6px}
.vol input{width:85px}

.bar{
  background:var(--side);
  padding:12px 10px 24px;
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid #1a1b1e;flex-shrink:0;
}
.bar button{
  width:48px;height:48px;border-radius:50%;border:none;
  background:#1e1f22;color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.bar button.red{background:var(--red)}
.bar button.on{background:var(--red)}

.roomcode{
  text-align:center;font-size:12px;color:var(--muted);
  padding:6px 0 4px;background:var(--side);
}

.panel{position:fixed;left:12px;right:12px;bottom:100px;background:var(--side);border-radius:12px;padding:14px;z-index:40;display:none;max-height:45vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.panel h3{font-size:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid button{padding:10px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:13px;cursor:pointer}
.grid button.sel{background:var(--blue)}
.panel .x{margin-top:10px;width:100%;padding:10px;background:var(--dark);border:none;border-radius:6px;color:#fff;cursor:pointer}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:50}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Voice Room</h1>
    <div class="sub">Choose mode and join</div>
    <div class="modes">
      <button id="mPeer" class="on">Unlimited</button>
      <button id="mLive">LiveKit</button>
    </div>
    <div class="av" id="av">
      <span id="avT">?</span>
      <input type="file" id="photo" accept="image/*">
    </div>
    <input type="text" id="name" placeholder="Your name" maxlength="18">
    <button class="btn" id="go">Join Room</button>
    <div class="note" id="note">Unlimited room code: <b>ffmic</b></div>
  </div>
</div>

<div id="room">
  <div class="top">
    <div class="t" id="title">Voice Room</div>
    <div class="c" id="count">0 online</div>
  </div>
  <div id="list"></div>
  <div class="roomcode" id="codeText"></div>
  <div class="bar">
    <button id="bMute">🎤</button>
    <button id="bDeaf">🔊</button>
    <button id="bCam">📷</button>
    <button id="bVoice">🎙️</button>
    <button id="bLeave" class="red">✖</button>
  </div>
</div>

<div class="panel" id="vPanel">
  <h3>Voice Changer</h3>
  <div class="grid" id="vGrid"></div>
  <button class="x" id="vClose">Close</button>
</div>

<div class="toast" id="toast"></div>

<script>
const LK = "wss://ffmic-43kbick8.livekit.cloud";
const TOKEN = "https://ffmic.mdxnirob.workers.dev/";
const LK_ROOM = "main-room";
const PEER_ROOM = "ffmic";           // fixed room code
const HOST_ID = "ffmic-host";        // fixed host peer id

const ICE = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:free.expressturn.com:3478",
      username: "000000002106201354",
      credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
    }
  ]
};

const VOICES = [
  {n:"Normal",p:1},{n:"Kid",p:1.5},{n:"Boy",p:1.25},{n:"Girl",p:1.4},
  {n:"Adult Male",p:0.85},{n:"Adult Female",p:1.15},{n:"Deep",p:0.7},
  {n:"Helium",p:1.65},{n:"Monster",p:0.55},{n:"Chipmunk",p:1.8}
];

let mode = "peer";
let myName = localStorage.getItem("vr_name") || "";
let myAvatar = localStorage.getItem("vr_avatar") || "";
let stream = null, muted = false, deaf = false, cam = false;
let peer = null, room = null, isHost = false, calls = {};

const $ = id => document.getElementById(id);
if (myName) $("name").value = myName;
if (myAvatar) {
  \( ("av").innerHTML = `<img src=" \){myAvatar}"><input type="file" id="photo" accept="image/*">`;
  $("photo").onchange = onPhoto;
} else $("photo").onchange = onPhoto;

function onPhoto(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    myAvatar = r.result;
    localStorage.setItem("vr_avatar", myAvatar);
    \( ("av").innerHTML = `<img src=" \){myAvatar}"><input type="file" id="photo" accept="image/*">`;
    $("photo").onchange = onPhoto;
  };
  r.readAsDataURL(f);
}

$("mPeer").onclick = () => {
  mode = "peer";
  $("mPeer").classList.add("on"); $("mLive").classList.remove("on");
  $("note").innerHTML = 'Unlimited room code: <b>ffmic</b>';
};
$("mLive").onclick = () => {
  mode = "live";
  $("mLive").classList.add("on"); $("mPeer").classList.remove("on");
  $("note").textContent = "LiveKit mode (better quality)";
};

VOICES.forEach((v,i) => {
  const b = document.createElement("button");
  b.textContent = v.n;
  if (i===0) b.classList.add("sel");
  b.onclick = () => {
    document.querySelectorAll("#vGrid button").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    toast("Voice: " + v.n);
  };
  $("vGrid").appendChild(b);
});

$("go").onclick = start;
$("bMute").onclick = () => {
  muted = !muted;
  if (stream) stream.getAudioTracks().forEach(t => t.enabled = !muted);
  if (room) room.localParticipant.setMicrophoneEnabled(!muted);
  $("bMute").classList.toggle("on", muted);
  $("bMute").textContent = muted ? "🔇" : "🎤";
};
$("bDeaf").onclick = () => {
  deaf = !deaf;
  document.querySelectorAll("audio").forEach(a => a.muted = deaf);
  $("bDeaf").classList.toggle("on", deaf);
  $("bDeaf").textContent = deaf ? "🔇" : "🔊";
};
$("bCam").onclick = toggleCam;
$("bVoice").onclick = () => $("vPanel").style.display = $("vPanel").style.display === "block" ? "none" : "block";
$("vClose").onclick = () => $("vPanel").style.display = "none";
$("bLeave").onclick = leave;

function toast(m) {
  $("toast").textContent = m;
  $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none", 2000);
}

async function start() {
  myName = ($("name").value || "").trim() || "Guest";
  localStorage.setItem("vr_name", myName);

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    alert("Allow microphone");
    return;
  }

  $("login").style.display = "none";
  $("room").style.display = "flex";
  $("title").textContent = mode === "peer" ? "Unlimited Room" : "LiveKit Room";
  $("codeText").textContent = mode === "peer" ? "Room code: ffmic" : "";

  if (mode === "peer") startPeer();
  else startLive();
}

// ========== PEERJS with fixed room "ffmic" ==========
function startPeer() {
  // First try to become the host
  peer = new Peer(HOST_ID, { config: ICE, debug: 1 });

  peer.on("open", id => {
    isHost = true;
    console.log("I am HOST:", id);
    toast("You are the Host");
    drawPeer();
  });

  peer.on("call", call => {
    call.answer(stream);
    handleCall(call);
  });

  peer.on("connection", conn => {
    conn.on("data", d => {
      if (d && d.type === "hello") {
        // call the new person
        const c = peer.call(d.id, stream);
        if (c) handleCall(c);
      }
    });
  });

  peer.on("error", err => {
    if (err.type === "unavailable-id") {
      // Host already exists → join as client
      joinAsClient();
    } else {
      console.log(err);
      toast("Peer: " + err.type);
    }
  });
}

function joinAsClient() {
  peer = new Peer({ config: ICE, debug: 1 });

  peer.on("open", id => {
    isHost = false;
    console.log("I am client:", id);
    toast("Joined room ffmic");

    // Call the host
    const call = peer.call(HOST_ID, stream);
    if (call) handleCall(call);

    // Also send hello via data
    const conn = peer.connect(HOST_ID);
    conn.on("open", () => conn.send({ type: "hello", id: id, name: myName }));

    drawPeer();
  });

  peer.on("call", call => {
    call.answer(stream);
    handleCall(call);
  });

  peer.on("error", e => console.log(e));
}

function handleCall(call) {
  calls[call.peer] = call;
  call.on("stream", remote => {
    play(call.peer, remote);
    drawPeer();
  });
  call.on("close", () => {
    delete calls[call.peer];
    const a = document.getElementById("a-" + call.peer);
    if (a) a.remove();
    drawPeer();
  });
}

function drawPeer() {
  $("list").innerHTML = "";
  const me = makeUser(myName, true, myAvatar);
  $("list").appendChild(me);

  Object.keys(calls).forEach(pid => {
    const d = makeUser("User", false, null);
    d.id = "u-" + pid;
    $("list").appendChild(d);
  });
  $("count").textContent = (1 + Object.keys(calls).length) + " online";
}

// ========== LIVEKIT ==========
async function startLive() {
  try {
    const res = await fetch(TOKEN + "?name=" + encodeURIComponent(myName) + "&room=" + LK_ROOM);
    const txt = await res.text();
    let data; try { data = JSON.parse(txt); } catch(e) { throw new Error("Token error"); }
    if (!data.token) throw new Error("No token");

    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, drawLive);
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, drawLive);
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, sp => {
      document.querySelectorAll(".user").forEach(u => u.classList.remove("talk"));
      sp.forEach(s => {
        const el = document.getElementById("u-" + s.identity);
        if (el) el.classList.add("talk");
      });
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind === "audio") {
        const a = track.attach();
        a.id = "a-" + p.identity;
        a.autoplay = true;
        document.body.appendChild(a);
      }
    });

    await room.connect(LK, data.token);
    await room.localParticipant.setMicrophoneEnabled(true);
    drawLive();
    toast("Connected to LiveKit");
  } catch (e) {
    alert("LiveKit failed: " + e.message);
    leave();
  }
}

function drawLive() {
  if (!room) return;
  $("list").innerHTML = "";
  const all = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
  $("count").textContent = all.length + " online";
  all.forEach(p => {
    const local = p === room.localParticipant;
    const name = local ? myName : (p.name || p.identity);
    const div = makeUser(name, local, local ? myAvatar : null);
    div.id = "u-" + p.identity;
    if (!local) {
      const vol = document.createElement("div");
      vol.className = "vol";
      vol.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
      vol.querySelector("input").oninput = e => {
        const a = document.getElementById("a-" + p.identity);
        if (a) a.volume = e.target.value;
      };
      div.appendChild(vol);
    }
    $("list").appendChild(div);
  });
}

function makeUser(name, local, avatar) {
  const d = document.createElement("div");
  d.className = "user";
  const letter = (name || "?").charAt(0).toUpperCase();
  let pic = letter;
  if (avatar) pic = `<img src="${avatar}">`;
  d.innerHTML = `<div class="pic">\( {pic}</div><div class="nm"> \){name}</div>${local ? '<div class="tag">you</div>' : ''}`;
  return d;
}

function play(id, media) {
  let a = document.getElementById("a-" + id);
  if (!a) {
    a = document.createElement("audio");
    a.id = "a-" + id;
    a.autoplay = true;
    document.body.appendChild(a);
  }
  a.srcObject = media;
}

async function toggleCam() {
  if (!cam) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
      const t = s.getVideoTracks()[0];
      if (room) await room.localParticipant.publishTrack(t);
      cam = true;
      $("bCam").classList.add("on");
      toast("Camera On");
    } catch (e) { alert("Camera error"); }
  } else {
    if (room) {
      room.localParticipant.videoTrackPublications.forEach(async pub => {
        if (pub.track) {
          await room.localParticipant.unpublishTrack(pub.track);
          pub.track.stop();
        }
      });
    }
    cam = false;
    $("bCam").classList.remove("on");
    toast("Camera Off");
  }
}

function leave() {
  if (peer) peer.destroy();
  if (room) room.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.querySelectorAll("audio").forEach(a => a.remove());
  location.reload();
}
</script>
</body>
  </html>
