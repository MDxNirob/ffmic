<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Voice Room</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
<style>
:root {
  --bg: #313338;
  --side: #2b2d31;
  --dark: #1e1f22;
  --blue: #5865f2;
  --green: #23a559;
  --red: #ed4245;
  --text: #f2f3f5;
  --muted: #b5bac1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "gg sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* LOGIN */
#login {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--dark);
  padding: 16px;
}
.card {
  background: var(--side);
  width: 100%;
  max-width: 400px;
  border-radius: 12px;
  padding: 28px 22px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}
.card h1 {
  text-align: center;
  font-size: 24px;
  color: #fff;
  margin-bottom: 6px;
}
.card .sub {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 20px;
}
.modes {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.modes button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  background: var(--dark);
  color: var(--text);
}
.modes button.on {
  background: var(--blue);
  color: #fff;
}
.avatar-box {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--blue);
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: #fff;
  overflow: hidden;
  position: relative;
  border: 3px solid #3f4147;
}
.avatar-box img { width: 100%; height: 100%; object-fit: cover; }
.avatar-box input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 15px;
  margin-bottom: 12px;
}
.join-btn {
  width: 100%;
  padding: 13px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.hint {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

/* ROOM */
#room {
  display: none;
  flex-direction: column;
  height: 100%;
}
.topbar {
  height: 48px;
  background: var(--side);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #1a1b1e;
  flex-shrink: 0;
}
.topbar .title { font-weight: 600; font-size: 15px; color: #fff; }
.topbar .online { font-size: 13px; color: var(--muted); }
#members {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  align-content: start;
}
.member {
  background: var(--side);
  border-radius: 10px;
  padding: 14px 10px;
  text-align: center;
  transition: box-shadow 0.15s;
  position: relative;
}
.member.speaking {
  box-shadow: 0 0 0 3px var(--green);
}
.member .pic {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--blue);
  margin: 0 auto 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
  position: relative;
}
.member .pic img { width: 100%; height: 100%; object-fit: cover; }
.member .pic .emoji {
  position: absolute;
  bottom: -3px;
  right: -3px;
  font-size: 18px;
  background: var(--side);
  border-radius: 50%;
  padding: 2px;
}
.member .name {
  font-size: 14px;
  font-weight: 500;
  color: #fff;
}
.member .you {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
}
.member .vol {
  margin-top: 8px;
}
.member .vol input {
  width: 90px;
  accent-color: var(--blue);
}

.bottom {
  background: var(--side);
  padding: 10px 10px 20px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  border-top: 1px solid #1a1b1e;
  flex-shrink: 0;
}
.bottom button {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: #1e1f22;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bottom button.danger { background: var(--red); }
.bottom button.active { background: var(--red); }

.panel {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 90px;
  background: var(--side);
  border-radius: 12px;
  padding: 16px;
  z-index: 50;
  display: none;
  max-height: 50vh;
  overflow-y: auto;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
}
.panel h3 {
  font-size: 15px;
  color: #fff;
  margin-bottom: 12px;
}
.panel .grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.panel .grid button {
  padding: 12px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
}
.panel input[type=text] {
  width: 100%;
  padding: 10px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  margin-bottom: 8px;
}
.panel .close {
  margin-top: 10px;
  width: 100%;
  padding: 11px;
  background: var(--dark);
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
}

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.88);
  color: #fff;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  display: none;
  z-index: 60;
}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Voice Room</h1>
    <div class="sub">Enter name & photo, then join</div>

    <div class="modes">
      <button id="btnPeer" class="on">Unlimited</button>
      <button id="btnLive">LiveKit</button>
    </div>

    <div class="avatar-box" id="avatarBox">
      <span>?</span>
      <input type="file" id="photoInput" accept="image/*" />
    </div>

    <input type="text" id="nameInput" placeholder="Display name" maxlength="20" />
    <button class="join-btn" id="joinBtn">Join Voice Room</button>
    <div class="hint" id="modeHint">Unlimited mode has no time limit</div>
  </div>
</div>

<div id="room">
  <div class="topbar">
    <div class="title" id="roomTitle">Voice Room</div>
    <div class="online" id="onlineCount">0 online</div>
  </div>

  <div id="members"></div>

  <div class="bottom">
    <button id="btnMute">🎤</button>
    <button id="btnDeafen">🔊</button>
    <button id="btnEmoji">😀</button>
    <button id="btnSound">🎵</button>
    <button id="btnEdit">✏️</button>
    <button id="btnLeave" class="danger">✖</button>
  </div>
</div>

<div class="panel" id="emojiPanel">
  <h3>Emoji</h3>
  <div class="grid" id="emojiGrid"></div>
  <button class="close" id="closeEmoji">Close</button>
</div>

<div class="panel" id="soundPanel">
  <h3>Play Sound / Meme</h3>
  <input type="text" id="soundUrl" placeholder="Paste mp3 or ogg link" />
  <button class="close" id="playSoundBtn">Play</button>
  <button class="close" id="closeSound">Close</button>
</div>

<div class="panel" id="editPanel">
  <h3>Edit Profile</h3>
  <input type="text" id="editName" placeholder="New name" maxlength="20" />
  <input type="file" id="editPhoto" accept="image/*" style="margin-bottom:10px;color:var(--muted)" />
  <button class="close" id="saveEdit">Save</button>
  <button class="close" id="closeEdit">Cancel</button>
</div>

<div class="toast" id="toast"></div>

<script>
const LIVEKIT_URL = "wss://ffmic-43kbick8.livekit.cloud";
const TOKEN_URL = "https://ffmic.mdxnirob.workers.dev/";
const LIVEKIT_ROOM = "main-room";
const PEER_HOST_ID = "ffmic-host";

const ICE = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:free.expressturn.com:3478",
      username: "000000002106201354",
      credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
    }
  ]
};

const EMOJIS = ["😀","😂","❤️","🔥","👍","👎","😮","😢","😡","🎉","💀","✨","👏","🙏","💯","😎"];

let mode = "peer";
let myName = localStorage.getItem("vr_name") || "";
let myAvatar = localStorage.getItem("vr_avatar") || "";
let stream = null;
let muted = false;
let deafened = false;
let myEmoji = "";
let peer = null;
let livekitRoom = null;
let calls = {};
let remoteInfo = {};

const $ = id => document.getElementById(id);

if (myName) $("nameInput").value = myName;
if (myAvatar) {
  \( ("avatarBox").innerHTML = `<img src=" \){myAvatar}"><input type="file" id="photoInput" accept="image/*">`;
  $("photoInput").onchange = onPhoto;
} else {
  $("photoInput").onchange = onPhoto;
}

function onPhoto(e) {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    myAvatar = r.result;
    localStorage.setItem("vr_avatar", myAvatar);
    \( ("avatarBox").innerHTML = `<img src=" \){myAvatar}"><input type="file" id="photoInput" accept="image/*">`;
    $("photoInput").onchange = onPhoto;
  };
  r.readAsDataURL(f);
}

$("btnPeer").onclick = () => {
  mode = "peer";
  $("btnPeer").classList.add("on");
  $("btnLive").classList.remove("on");
  $("modeHint").textContent = "Unlimited mode has no time limit";
};
$("btnLive").onclick = () => {
  mode = "live";
  $("btnLive").classList.add("on");
  $("btnPeer").classList.remove("on");
  $("modeHint").textContent = "LiveKit – more stable for many people";
};

EMOJIS.forEach(em => {
  const b = document.createElement("button");
  b.textContent = em;
  b.onclick = () => {
    myEmoji = em;
    showToast(em);
    render();
    setTimeout(() => { myEmoji = ""; render(); }, 3000);
    $("emojiPanel").style.display = "none";
  };
  $("emojiGrid").appendChild(b);
});

$("joinBtn").onclick = join;
$("btnMute").onclick = toggleMute;
$("btnDeafen").onclick = toggleDeafen;
$("btnEmoji").onclick = () => { closePanels(); $("emojiPanel").style.display = "block"; };
$("btnSound").onclick = () => { closePanels(); $("soundPanel").style.display = "block"; };
$("btnEdit").onclick = () => {
  closePanels();
  $("editName").value = myName;
  $("editPanel").style.display = "block";
};
$("btnLeave").onclick = leave;

$("closeEmoji").onclick = () => $("emojiPanel").style.display = "none";
$("closeSound").onclick = () => $("soundPanel").style.display = "none";
$("closeEdit").onclick = () => $("editPanel").style.display = "none";

$("playSoundBtn").onclick = () => {
  const url = $("soundUrl").value.trim();
  if (!url) return showToast("Paste a link");
  new Audio(url).play().catch(() => showToast("Cannot play"));
  showToast("Playing...");
};

$("saveEdit").onclick = () => {
  const n = $("editName").value.trim();
  if (n) {
    myName = n;
    localStorage.setItem("vr_name", myName);
  }
  const f = $("editPhoto").files[0];
  if (f) {
    const r = new FileReader();
    r.onload = () => {
      myAvatar = r.result;
      localStorage.setItem("vr_avatar", myAvatar);
      render();
    };
    r.readAsDataURL(f);
  } else render();
  $("editPanel").style.display = "none";
  showToast("Profile updated");
};

function closePanels() {
  $("emojiPanel").style.display = "none";
  $("soundPanel").style.display = "none";
  $("editPanel").style.display = "none";
}

function showToast(msg) {
  $("toast").textContent = msg;
  $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none", 2000);
}

async function join() {
  myName = ($("nameInput").value || "").trim() || "Guest";
  localStorage.setItem("vr_name", myName);

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false
    });
  } catch (e) {
    alert("Please allow microphone");
    return;
  }

  $("login").style.display = "none";
  $("room").style.display = "flex";
  $("roomTitle").textContent = mode === "peer" ? "Unlimited Room" : "LiveKit Room";

  if (mode === "peer") startPeer();
  else startLiveKit();
}

// ========== PEERJS ==========
function startPeer() {
  peer = new Peer(PEER_HOST_ID, { config: ICE });

  peer.on("open", () => {
    showToast("You are Host");
    render();
  });

  peer.on("call", call => {
    call.answer(stream);
    handleCall(call);
  });

  peer.on("connection", conn => {
    conn.on("data", d => {
      if (d && d.type === "join") {
        remoteInfo[d.id] = { name: d.name, avatar: d.avatar || "" };
        const c = peer.call(d.id, stream);
        if (c) handleCall(c);
        conn.send({ type: "info", name: myName, avatar: myAvatar });
      }
    });
  });

  peer.on("error", err => {
    if (err.type === "unavailable-id") joinAsClient();
    else showToast(err.type);
  });
}

function joinAsClient() {
  peer = new Peer({ config: ICE });

  peer.on("open", id => {
    showToast("Joined room");

    const call = peer.call(PEER_HOST_ID, stream);
    if (call) handleCall(call);

    const conn = peer.connect(PEER_HOST_ID);
    conn.on("open", () => {
      conn.send({ type: "join", id: id, name: myName, avatar: myAvatar });
    });
    conn.on("data", d => {
      if (d && d.type === "info") {
        remoteInfo[PEER_HOST_ID] = { name: d.name, avatar: d.avatar || "" };
        render();
      }
    });

    render();
  });

  peer.on("call", call => {
    call.answer(stream);
    handleCall(call);
  });
}

function handleCall(call) {
  calls[call.peer] = call;
  call.on("stream", remote => {
    playAudio(call.peer, remote);
    render();
  });
  call.on("close", () => {
    delete calls[call.peer];
    delete remoteInfo[call.peer];
    const a = document.getElementById("audio-" + call.peer);
    if (a) a.remove();
    render();
  });
}

// ========== LIVEKIT ==========
async function startLiveKit() {
  try {
    const res = await fetch(TOKEN_URL + "?name=" + encodeURIComponent(myName) + "&room=" + LIVEKIT_ROOM);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { throw new Error("Token error"); }
    if (!data.token) throw new Error("No token");

    livekitRoom = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    livekitRoom.on(LivekitClient.RoomEvent.ParticipantConnected, render);
    livekitRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, render);
    livekitRoom.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, speakers => {
      document.querySelectorAll(".member").forEach(m => m.classList.remove("speaking"));
      speakers.forEach(s => {
        const el = document.getElementById("m-" + s.identity);
        if (el) el.classList.add("speaking");
      });
    });
    livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind === "audio") {
        const el = track.attach();
        el.id = "audio-" + p.identity;
        el.autoplay = true;
        document.body.appendChild(el);
      }
    });

    await livekitRoom.connect(LIVEKIT_URL, data.token);
    await livekitRoom.localParticipant.setMicrophoneEnabled(true);
    render();
    showToast("Connected");
  } catch (err) {
    alert("LiveKit failed: " + err.message);
    leave();
  }
}

// ========== RENDER ==========
function render() {
  if (mode === "peer") renderPeer();
  else if (livekitRoom) renderLive();
}

function renderPeer() {
  $("members").innerHTML = "";
  const local = createCard(myName, true, myAvatar, myEmoji);
  $("members").appendChild(local);

  Object.keys(calls).forEach(pid => {
    const info = remoteInfo[pid] || { name: "User", avatar: "" };
    const card = createCard(info.name, false, info.avatar, "");
    card.id = "m-" + pid;
    $("members").appendChild(card);
  });
  $("onlineCount").textContent = (1 + Object.keys(calls).length) + " online";
}

function renderLive() {
  if (!livekitRoom) return;
  $("members").innerHTML = "";
  const all = [livekitRoom.localParticipant, ...Array.from(livekitRoom.remoteParticipants.values())];
  $("onlineCount").textContent = all.length + " online";

  all.forEach(p => {
    const isLocal = p === livekitRoom.localParticipant;
    const name = isLocal ? myName : (p.name || p.identity);
    const avatar = isLocal ? myAvatar : null;
    const emoji = isLocal ? myEmoji : "";
    const card = createCard(name, isLocal, avatar, emoji);
    card.id = "m-" + p.identity;

    if (!isLocal) {
      const vol = document.createElement("div");
      vol.className = "vol";
      vol.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
      vol.querySelector("input").oninput = e => {
        const a = document.getElementById("audio-" + p.identity);
        if (a) a.volume = e.target.value;
      };
      card.appendChild(vol);
    }
    $("members").appendChild(card);
  });
}

function createCard(name, isLocal, avatar, emoji) {
  const div = document.createElement("div");
  div.className = "member";
  const letter = (name || "?").charAt(0).toUpperCase();
  let pic = letter;
  if (avatar) pic = `<img src="${avatar}">`;
  div.innerHTML = `
    <div class="pic">\( {pic}<span class="emoji"> \){emoji || ""}</span></div>
    <div class="name">${name}</div>
    ${isLocal ? '<div class="you">you</div>' : ''}
  `;
  return div;
}

function playAudio(id, media) {
  let a = document.getElementById("audio-" + id);
  if (!a) {
    a = document.createElement("audio");
    a.id = "audio-" + id;
    a.autoplay = true;
    document.body.appendChild(a);
  }
  a.srcObject = media;
}

function toggleMute() {
  muted = !muted;
  if (stream) stream.getAudioTracks().forEach(t => t.enabled = !muted);
  if (livekitRoom) livekitRoom.localParticipant.setMicrophoneEnabled(!muted);
  $("btnMute").classList.toggle("active", muted);
  $("btnMute").textContent = muted ? "🔇" : "🎤";
  showToast(muted ? "Muted" : "Unmuted");
}

function toggleDeafen() {
  deafened = !deafened;
  document.querySelectorAll("audio").forEach(a => a.muted = deafened);
  $("btnDeafen").classList.toggle("active", deafened);
  $("btnDeafen").textContent = deafened ? "🔇" : "🔊";
  showToast(deafened ? "Deafened" : "Undeafened");
}

function leave() {
  if (peer) peer.destroy();
  if (livekitRoom) livekitRoom.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.querySelectorAll("audio").forEach(a => a.remove());
  location.reload();
}
</script>
</body>
  </html>
