<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Room</title>
    <style>
        /* Discord-inspired Dark Theme */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #36393f; color: #dcddde; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .container { padding: 20px; max-width: 500px; width: 100%; box-sizing: border-box; }
        .panel { background-color: #2f3136; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 20px; }
        h2, h3 { margin-top: 0; color: #ffffff; }
        input { padding: 12px; margin: 8px 0 16px 0; width: 100%; box-sizing: border-box; border-radius: 4px; border: none; font-size: 16px; background-color: #202225; color: #dcddde; outline: none; }
        input:focus { box-shadow: 0 0 0 2px #5865F2; }
        button { padding: 12px; margin: 5px 0; width: 100%; border-radius: 4px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; color: white; }
        
        /* Button States */
        .btn-primary { background-color: #5865F2; }
        .btn-primary:hover { background-color: #4752C4; }
        .btn-active { background-color: #3ba55d; } /* Green for ON */
        .btn-active:hover { background-color: #2d7d46; }
        .btn-danger { background-color: #ed4245; } /* Red for Muted/Deafened */
        .btn-danger:hover { background-color: #c83336; }
        
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        #room-ui { display: none; }
        .users-list { margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .user { display: flex; align-items: center; padding: 10px; background: #202225; margin-bottom: 8px; border-radius: 4px; }
        .user-avatar { width: 32px; height: 32px; background: #5865F2; border-radius: 50%; margin-right: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <!-- Join Screen -->
    <div class="container" id="login-ui">
        <div class="panel">
            <h2>Join Voice Room</h2>
            <label>Display Name</label>
            <input type="text" id="username" placeholder="e.g. Nirob">
            
            <button id="join-btn" class="btn-primary">Connect</button>
        </div>
    </div>

    <!-- Room Screen -->
    <div class="container" id="room-ui">
        <div class="panel">
            <h2>Connected</h2>
            <div class="controls">
                <button id="mute-self-btn" class="btn-active">Mic: ON</button>
                <button id="deafen-btn" class="btn-active">Audio: ON</button>
            </div>
            <button id="leave-btn" class="btn-danger" style="margin-top: 15px;">Disconnect</button>
        </div>
        <div class="panel">
            <h3>Participants</h3>
            <div class="users-list" id="users-list">
                <!-- Users will be injected here -->
            </div>
        </div>
    </div>

    <!-- Trystero handles Serverless WebRTC Mesh Networking -->
    <script type="module">
        import { joinRoom } from 'https://unpkg.com/trystero/torrent';

        const loginUi = document.getElementById('login-ui');
        const roomUi = document.getElementById('room-ui');
        const joinBtn = document.getElementById('join-btn');
        const usernameInput = document.getElementById('username');
        
        const usersList = document.getElementById('users-list');
        const muteSelfBtn = document.getElementById('mute-self-btn');
        const deafenBtn = document.getElementById('deafen-btn');
        const leaveBtn = document.getElementById('leave-btn');

        // --- Load saved name from previous visits ---
        const savedName = localStorage.getItem('savedVoiceName');
        if (savedName) {
            usernameInput.value = savedName;
        }

        let room;
        let localStream;
        let myName = '';
        let peers = {}; 

        const config = {
            appId: 'github-pages-voice-chat-v1', 
            rtcConfig: {
                iceServers: [
                    { urls: 'stun:free.expressturn.com:3478' },
                    {
                        urls: 'turn:free.expressturn.com:3478',
                        username: '000000002106201354',
                        credential: 'UXvxNY1DQ3mNNPzliqVLL8rHUcY='
                    }
                ]
            }
        };

        // Hardcoded room name so everyone joins the exact same mesh
        const GLOBAL_ROOM_NAME = 'main-global-voice-room';

        joinBtn.addEventListener('click', async () => {
            myName = usernameInput.value.trim() || 'Anonymous';

            // --- Save the name for the next time they visit ---
            localStorage.setItem('savedVoiceName', myName);

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                        channelCount: 2
                    },
                    video: false
                });

                room = joinRoom(config, GLOBAL_ROOM_NAME);

                const [sendName, getName] = room.makeAction('name');

                addUserToUI('local', myName + ' (You)');

                room.onPeerJoin(peerId => {
                    sendName(myName, peerId); 
                    addUserToUI(peerId, 'Connecting...');
                });

                getName((name, peerId) => {
                    peers[peerId] = { ...peers[peerId], name };
                    updateUserNameUI(peerId, name);
                });

                room.onPeerLeave(peerId => {
                    removeUserFromUI(peerId);
                    delete peers[peerId];
                });

                room.onPeerStream((stream, peerId) => {
                    const audio = new Audio();
                    audio.srcObject = stream;
                    audio.autoplay = true;
                    peers[peerId] = { ...peers[peerId], audio };
                    
                    if (isDeafened) audio.muted = true;
                    
                    audio.play().catch(e => console.error("Audio playback error:", e));
                });

                room.addStream(localStream);

                loginUi.style.display = 'none';
                roomUi.style.display = 'block';

            } catch (err) {
                alert('Microphone access denied or error occurred.');
                console.error(err);
            }
        });
        
        let isMuted = false;
        muteSelfBtn.addEventListener('click', () => {
            if (!localStream) return;
            isMuted = !isMuted;
            
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            if (isMuted) {
                muteSelfBtn.innerText = 'Mic: MUTED';
                muteSelfBtn.className = 'btn-danger';
            } else {
                muteSelfBtn.innerText = 'Mic: ON';
                muteSelfBtn.className = 'btn-active';
            }
        });

        let isDeafened = false;
        deafenBtn.addEventListener('click', () => {
            isDeafened = !isDeafened;
            
            Object.values(peers).forEach(peer => {
                if (peer.audio) peer.audio.muted = isDeafened;
            });

            if (isDeafened) {
                deafenBtn.innerText = 'Audio: DEAFENED';
                deafenBtn.className = 'btn-danger';
            } else {
                deafenBtn.innerText = 'Audio: ON';
                deafenBtn.className = 'btn-active';
            }
        });

        leaveBtn.addEventListener('click', () => {
            if (room) room.leave(); 
            if (localStream) localStream.getTracks().forEach(track => track.stop()); 
            
            usersList.innerHTML = '';
            peers = {};
            roomUi.style.display = 'none';
            loginUi.style.display = 'flex';
            
            isMuted = false;
            isDeafened = false;
            muteSelfBtn.innerText = 'Mic: ON';
            muteSelfBtn.className = 'btn-active';
            deafenBtn.innerText = 'Audio: ON';
            deafenBtn.className = 'btn-active';
        });

        function addUserToUI(id, displayName) {
            if (document.getElementById(`user-${id}`)) return;
            const userDiv = document.createElement('div');
            userDiv.className = 'user';
            userDiv.id = `user-${id}`;
            userDiv.innerHTML = `
                <div class="user-avatar">${displayName.charAt(0).toUpperCase()}</div>
                <div class="user-name">${displayName}</div>
            `;
            usersList.appendChild(userDiv);
        }

        function updateUserNameUI(id, newName) {
            const userDiv = document.getElementById(`user-${id}`);
            if (userDiv) {
                userDiv.querySelector('.user-name').innerText = newName;
                userDiv.querySelector('.user-avatar').innerText = newName.charAt(0).toUpperCase();
            }
        }

        function removeUserFromUI(id) {
            const userDiv = document.getElementById(`user-${id}`);
            if (userDiv) userDiv.remove();
        }
    </script>
</body>
</html>
