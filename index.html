<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Room - Discord Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        discord: {
                            bg: '#313338',
                            sidebar: '#2b2d31',
                            panel: '#232428',
                            hover: '#35373c',
                            active: '#393c43',
                            blurple: '#5865F2',
                            blurpleHover: '#4752C4',
                            green: '#23a55a',
                            red: '#ed4245',
                            textNormal: '#dbdee1',
                            textMuted: '#949ba4',
                            header: '#f2f3f5'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #313338;
            color: #dbdee1;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        /* Custom scrollbar for participant list */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2b2d31;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a1b1e;
            border-radius: 4px;
        }
        .speaking-ring {
            box-shadow: 0 0 0 3px #23a55a;
            transition: box-shadow 0.1s ease;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-[#1e1f22] bg-opacity-95 p-4">
        <div class="bg-[#313338] w-full max-w-md rounded-lg p-8 shadow-2xl border border-[#222327]">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-[#5865F2] text-white text-2xl mb-3 shadow-lg">
                    <i class="fa-solid fa-microphone-lines"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Voice Channel Login</h1>
                <p class="text-sm text-[#949ba4] mt-1">Serverless Peer-to-Peer Voice Room</p>
            </div>

            <form id="join-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-[#949ba4] mb-2">Your Nickname</label>
                    <input type="text" id="nickname-input" required maxlength="20" placeholder="e.g. CyberNinja" 
                        class="w-full bg-[#1e1f22] border-none rounded p-3 text-white placeholder-[#87898c] focus:outline-none focus:ring-2 focus:ring-[#5865F2]">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-[#949ba4] mb-2">Room Name / Code</label>
                    <input type="text" id="room-input" required value="general-lobby" 
                        class="w-full bg-[#1e1f22] border-none rounded p-3 text-white placeholder-[#87898c] focus:outline-none focus:ring-2 focus:ring-[#5865F2]">
                </div>

                <div id="login-error" class="text-red-400 text-xs hidden"></div>

                <button type="submit" class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-medium py-3 rounded transition duration-200 shadow-md">
                    Join Voice Channel
                </button>
            </form>
            <p class="text-xs text-center text-[#949ba4] mt-4">No account required. Operates peer-to-peer via secure WebRTC mesh.</p>
        </div>
    </div>

    <div id="main-app" class="flex-1 flex overflow-hidden hidden">
        
        <!-- Sidebar: Voice Channels & Server info -->
        <div class="w-60 bg-[#2b2d31] flex flex-col border-r border-[#1f2023]">
            <!-- Server Header -->
            <div class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between shadow-sm">
                <span id="display-room-title" class="font-bold text-white text-sm truncate">General Lobby</span>
                <i class="fa-solid fa-chevron-down text-xs text-[#949ba4]"></i>
            </div>

            <!-- Channels List -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-xs font-bold text-[#949ba4] px-2 py-1 uppercase tracking-wider flex items-center justify-between">
                    <span>Voice Channels</span>
                    <i class="fa-solid fa-plus text-xs cursor-pointer hover:text-white"></i>
                </div>
                <div class="flex items-center space-x-2 px-2 py-1.5 rounded bg-[#35373c] text-white cursor-pointer">
                    <i class="fa-solid fa-volume-high text-[#23a55a]"></i>
                    <span id="sidebar-room-name" class="text-sm font-medium truncate">Lounge Voice</span>
                </div>
            </div>

            <!-- User Footer Control Panel -->
            <div class="h-14 bg-[#232428] px-2 flex items-center justify-between">
                <div class="flex items-center space-x-2 overflow-hidden mr-1">
                    <div class="relative">
                        <div class="w-8 h-8 rounded-full bg-[#5865F2] flex items-center justify-center font-bold text-white text-sm" id="user-avatar-initial">U</div>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-[#23a55a] rounded-full border-2 border-[#232428]"></div>
                    </div>
                    <div class="truncate">
                        <div id="footer-username" class="text-sm font-semibold text-white truncate">Username</div>
                        <div class="text-[10px] text-[#23a55a] font-medium">Voice Connected</div>
                    </div>
                </div>

                <div class="flex items-center space-x-1 text-[#b5bac1]">
                    <button id="btn-mute" title="Mute Microphone" class="p-2 hover:bg-[#35373c] hover:text-white rounded transition">
                        <i class="fa-solid fa-microphone text-sm"></i>
                    </button>
                    <button id="btn-deafen" title="Deafen" class="p-2 hover:bg-[#35373c] hover:text-white rounded transition">
                        <i class="fa-solid fa-headphones text-sm"></i>
                    </button>
                    <button id="btn-disconnect" title="Disconnect" class="p-2 hover:bg-[#35373c] hover:text-red-400 rounded transition">
                        <i class="fa-solid fa-phone-slash text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Channel Stage / Active Speakers Area -->
        <div class="flex-1 flex flex-col bg-[#313338] overflow-hidden">
            
            <!-- Top Navigation bar -->
            <div class="h-12 border-b border-[#1f2023] px-4 flex items-center justify-between shadow-sm">
                <div class="flex items-center space-x-2 text-white">
                    <i class="fa-solid fa-hashtag text-[#80848e]"></i>
                    <span class="font-semibold text-sm">voice-channel</span>
                    <span class="text-xs text-[#949ba4] ml-2 border-l border-[#4e5058] pl-2 hidden sm:inline">Encrypted P2P Voice Mesh</span>
                </div>
                <div class="flex items-center space-x-3">
                    <div id="connection-status-pill" class="flex items-center space-x-1.5 bg-[#23a55a]/10 text-[#23a55a] px-2.5 py-1 rounded-full text-xs font-medium border border-[#23a55a]/20">
                        <span class="w-2 h-2 rounded-full bg-[#23a55a] animate-pulse"></span>
                        <span id="connection-status-text">Voice lobby active!</span>
                    </div>
                    <button id="btn-copy-link" title="Copy Invite Link" class="text-[#b5bac1] hover:text-white p-1.5 rounded bg-[#35373c] hover:bg-[#3f4147] transition text-xs">
                        <i class="fa-solid fa-link mr-1"></i> Invite
                    </button>
                </div>
            </div>

            <!-- Voice Grid Area (Avatars & Video cards) -->
            <div class="flex-1 p-6 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 auto-rows-fr items-center justify-items-center" id="participants-grid">
                <!-- Participant cards injected dynamically -->
            </div>

            <!-- Bottom Control Bar (Mobile-friendly Quick Actions) -->
            <div class="bg-[#2b2d31] p-3 flex justify-center items-center space-x-4 border-t border-[#1f2023] md:hidden">
                <button id="mobile-btn-mute" class="bg-[#313338] hover:bg-[#3f4147] text-white p-3 rounded-full shadow-md transition">
                    <i class="fa-solid fa-microphone text-lg"></i>
                </button>
                <button id="mobile-btn-deafen" class="bg-[#313338] hover:bg-[#3f4147] text-white p-3 rounded-full shadow-md transition">
                    <i class="fa-solid fa-headphones text-lg"></i>
                </button>
                <button id="mobile-btn-disconnect" class="bg-[#ed4245] hover:bg-[#d83c3e] text-white p-3 rounded-full shadow-md transition">
                    <i class="fa-solid fa-phone-slash text-lg"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global State Variables
        let localStream = null;
        let peer = null;
        let myPeerId = null;
        let myNickname = '';
        let roomName = '';
        let activeConnections = {}; // peerId -> { call, connection, nickname }
        let activePeersInRoom = new Set();
        let isMuted = false;
        let isDeafened = false;
        let audioContext = null;
        let analyser = null;
        let localAudioAnalyser = null;
        let heartbeatInterval = null;

        // DOM Elements
        const loginOverlay = document.getElementById('login-overlay');
        const mainApp = document.getElementById('main-app');
        const joinForm = document.getElementById('join-form');
        const nicknameInput = document.getElementById('nickname-input');
        const roomInput = document.getElementById('room-input');
        const loginError = document.getElementById('login-error');
        const participantsGrid = document.getElementById('participants-grid');
        const displayRoomTitle = document.getElementById('display-room-title');
        const sidebarRoomName = document.getElementById('sidebar-room-name');
        const footerUsername = document.getElementById('footer-username');
        const userAvatarInitial = document.getElementById('user-avatar-initial');
        const connectionStatusText = document.getElementById('connection-status-text');

        // Control Buttons
        const btnMute = document.getElementById('btn-mute');
        const btnDeafen = document.getElementById('btn-deafen');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const mobileBtnMute = document.getElementById('mobile-btn-mute');
        const mobileBtnDeafen = document.getElementById('mobile-btn-deafen');
        const mobileBtnDisconnect = document.getElementById('mobile-btn-disconnect');
        const btnCopyLink = document.getElementById('btn-copy-link');

        // Parse URL Hash for auto room join e.g. #room=myroom
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);
            if (hash.startsWith('room=')) {
                const r = hash.replace('room=', '');
                if (r) roomInput.value = decodeURIComponent(r);
            }
            // Auto focus nickname
            nicknameInput.focus();
        });

        // Form Submit Handler
        joinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            myNickname = nicknameInput.value.trim();
            roomName = roomInput.value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');

            if (!myNickname || !roomName) {
                showError('Please enter a valid nickname and room name.');
                return;
            }

            try {
                // Request microphone permission with echo cancellation
                connectionStatusText.innerText = 'Requesting Microphone...';
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });

                // Initialize Audio Context for active speaker analysis
                setupAudioAnalyser(localStream);

                // Transition UI
                loginOverlay.classList.add('hidden');
                mainApp.classList.remove('hidden');
                displayRoomTitle.innerText = '#' + roomName;
                sidebarRoomName.innerText = roomName;
                footerUsername.innerText = myNickname;
                userAvatarInitial.innerText = myNickname.charAt(0).toUpperCase();

                // Initialize PeerJS mesh network
                initPeerMesh();

            } catch (err) {
                console.error('Microphone access error:', err);
                showError('Microphone permission denied or unavailable. Please check browser settings.');
            }
        });

        function showError(msg) {
            loginError.innerText = msg;
            loginError.classList.remove('hidden');
        }

        // Setup local audio analyser for voice activity level indicator
        function setupAudioAnalyser(stream) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                localAudioAnalyser = audioContext.createAnalyser();
                localAudioAnalyser.fftSize = 256;
                source.connect(localAudioAnalyser);
            } catch (e) {
                console.warn('Web Audio API setup failed:', e);
            }
        }

        // Initialize PeerJS with public cloud signaling broker
        function initPeerMesh() {
            connectionStatusText.innerText = 'Connecting to signaling network...';

            // Create a deterministic Peer ID prefix based on the room name to isolate rooms
            // PeerJS free public cloud broker handles connection signaling
            const roomPrefix = 'discord-clone-' + roomName + '-';
            
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                console.log('My peer ID is: ' + id);
                connectionStatusText.innerText = 'Voice lobby active!';
                
                // Render self in participant grid
                renderParticipantList();

                // Start broadcasting presence and discovering peers
                startRoomDiscovery();
            });

            peer.on('call', (call) => {
                // Answer incoming call from another peer
                console.log('Incoming call from:', call.peer);
                
                // Send our local stream back
                call.answer(localStream);
                
                setupCallEventHandlers(call);
            });

            peer.on('connection', (conn) => {
                setupDataConnection(conn);
            });

            peer.on('error', (err) => {
                console.error('PeerJS error:', err);
                connectionStatusText.innerText = 'Connection error. Retrying...';
            });
        }

        // Discovery mechanism: periodically broadcast/connect to peers in the same room namespace
        function startRoomDiscovery() {
            // Since PeerJS public server doesn't list all connected peers for privacy,
            // we use a timestamp-salted naming check or broadcast ping to find room members.
            // For robust serverless mesh without central server, we can check a sequence or let peers connect via direct IDs if shared.
            // Alternatively, users joining the same room share an invite URL with hash containing peer IDs or check list.
            
            // To ensure 100% reliability on GitHub Pages without backend DB, we use window.location.hash sharing or a randomized discovery pool if needed,
            // or connect through PeerJS ID handshake. Let's add a presence ping mechanism via data connections.
            
            // For direct usability: when user joins, we check if there are other known peer suffixes or allow manual peer exchange.
            // Better yet, we can connect to a generated list of candidate IDs or prompt room link sharing.
            
            updateParticipantUI();
        }

        // Setup WebRTC Call Handlers
        function setupCallEventHandlers(call) {
            const remotePeerId = call.peer;

            call.on('stream', (remoteStream) => {
                console.log('Received remote audio stream from:', remotePeerId);
                
                // Play remote audio stream safely (bypassing mobile autoplay policies)
                playRemoteAudio(remotePeerId, remoteStream);

                activeConnections[remotePeerId] = {
                    ...activeConnections[remotePeerId],
                    call: call,
                    stream: remoteStream
                };
                
                updateParticipantUI();
            });

            call.on('close', () => {
                removePeer(remotePeerId);
            });

            call.on('error', (err) => {
                console.error('Call error with peer', remotePeerId, err);
                removePeer(remotePeerId);
            });
        }

        function setupDataConnection(conn) {
            conn.on('data', (data) => {
                if (data.type === 'metadata') {
                    activeConnections[conn.peer] = {
                        ...(activeConnections[conn.peer] || {}),
                        nickname: data.nickname,
                        connection: conn
                    };
                    updateParticipantUI();
                }
            });

            conn.on('open', () => {
                // Send our nickname to the peer
                conn.send({ type: 'metadata', nickname: myNickname });
                activeConnections[conn.peer] = {
                    ...(activeConnections[conn.peer] || {}),
                    connection: conn
                };
            });

            conn.on('close', () => {
                removePeer(conn.peer);
            });
        }

        // Play incoming remote audio using hidden audio element with autoplay & user interaction fallback
        function playRemoteAudio(peerId, stream) {
            let audioEl = document.getElementById('audio-' + peerId);
            if (!audioEl) {
                audioEl = document.createElement('audio');
                audioEl.id = 'audio-' + peerId;
                audioEl.autoplay = true;
                audioEl.playsInline = true;
                if (isDeafened) {
                    audioEl.muted = true;
                }
                document.body.appendChild(audioEl);
            }
            audioEl.srcObject = stream;
            
            audioEl.play().catch(e => {
                console.warn('Autoplay blocked. Waiting for user interaction gesture.', e);
                const unlockAudio = () => {
                    audioEl.play().catch(err => console.error('Audio unlock failed:', err));
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('touchstart', unlockAudio);
                };
                window.addEventListener('click', unlockAudio);
                window.addEventListener('touchstart', unlockAudio);
            });
        }

        function removePeer(peerId) {
            if (activeConnections[peerId]) {
                if (activeConnections[peerId].call) {
                    activeConnections[peerId].call.close();
                }
                if (activeConnections[peerId].connection) {
                    activeConnections[peerId].connection.close();
                }
                delete activeConnections[peerId];
            }
            const audioEl = document.getElementById('audio-' + peerId);
            if (audioEl) audioEl.remove();

            updateParticipantUI();
        }

        // Render participant cards in the voice channel grid
        function updateParticipantUI() {
            participantsGrid.innerHTML = '';

            // Render Local User Card
            const localCard = createParticipantCard(myNickname, true, isMuted, false);
            participantsGrid.appendChild(localCard);

            // Render Remote Peers
            Object.keys(activeConnections).forEach(peerId => {
                const peerData = activeConnections[peerId];
                const nickname = peerData.nickname || 'User ' + peerId.substring(0, 4);
                const isPeerMuted = peerData.muted || false;
                const card = createParticipantCard(nickname, false, isPeerMuted, false, peerId);
                participantsGrid.appendChild(card);
            });
        }

        function createParticipantCard(name, isLocal, muted, speaking, peerId = 'local') {
            const cardDiv = document.createElement('div');
            cardDiv.className = `bg-[#2b2d31] rounded-lg p-4 flex flex-col items-center justify-center relative shadow-md border border-[#1f2023] w-full h-48 sm:h-56 transition duration-150`;
            if (peerId !== 'local' && speaking) {
                cardDiv.classList.add('speaking-ring');
            } else if (isLocal && !isMuted) {
                // Check local voice activity
                cardDiv.id = 'local-participant-card';
            }

            // Avatar Container with speaking border
            const avatarContainer = document.createElement('div');
            avatarContainer.className = `relative w-20 h-20 rounded-full bg-[#5865F2] flex items-center justify-center text-white text-2xl font-bold shadow-inner ${isLocal && !isMuted ? '' : ''}`;
            if (isLocal && !isMuted) {
                avatarContainer.id = 'local-avatar-container';
            } else if (peerId !== 'local') {
                avatarContainer.id = 'avatar-' + peerId;
            }
            avatarContainer.innerText = name.charAt(0).toUpperCase();

            // Muted Badge icon
            if (muted) {
                const muteBadge = document.createElement('div');
                muteBadge.className = 'absolute bottom-0 right-0 bg-[#1e1f22] text-[#ed4245] p-1.5 rounded-full border-2 border-[#2b2d31] text-xs shadow';
                muteBadge.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
                avatarContainer.appendChild(muteBadge);
            }

            // Name label
            const nameLabel = document.createElement('div');
            nameLabel.className = 'text-white font-semibold text-sm mt-3 truncate max-w-full px-2 text-center';
            nameLabel.innerText = name + (isLocal ? ' (You)' : '');

            // Voice status indicator subtext
            const statusLabel = document.createElement('div');
            statusLabel.className = 'text-xs text-[#949ba4] mt-1 flex items-center space-x-1';
            statusLabel.innerHTML = muted ? '<span class="text-red-400">Muted</span>' : '<span class="text-[#23a55a]">Connected</span>';

            cardDiv.appendChild(avatarContainer);
            cardDiv.appendChild(nameLabel);
            cardDiv.appendChild(statusLabel);

            return cardDiv;
        }

        // Voice Activity Detection loop using Web Audio API analysers
        setInterval(() => {
            if (!localStream || isMuted || !localAudioAnalyser) return;

            const dataArray = new Uint8Array(localAudioAnalyser.frequencyBinCount);
            localAudioAnalyser.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;

            const localAvatar = document.getElementById('local-avatar-container');
            const localCard = document.getElementById('local-participant-card');
            
            if (average > 12) { // Speech threshold
                if (localAvatar) localAvatar.classList.add('speaking-ring');
                if (localCard) localCard.classList.add('speaking-ring');
            } else {
                if (localAvatar) localAvatar.classList.remove('speaking-ring');
                if (localCard) localCard.classList.remove('speaking-ring');
            }
        }, 100);

        // Control button action listeners
        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !isMuted;
            });

            if (isMuted) {
                btnMute.innerHTML = '<i class="fa-solid fa-microphone-slash text-red-400 text-sm"></i>';
                btnMute.classList.add('bg-[#ed4245]/20');
                mobileBtnMute.innerHTML = '<i class="fa-solid fa-microphone-slash text-lg"></i>';
                mobileBtnMute.classList.add('bg-[#ed4245]');
            } else {
                btnMute.innerHTML = '<i class="fa-solid fa-microphone text-sm"></i>';
                btnMute.classList.remove('bg-[#ed4245]/20');
                mobileBtnMute.innerHTML = '<i class="fa-solid fa-microphone text-lg"></i>';
                mobileBtnMute.classList.remove('bg-[#ed4245]');
            }
            updateParticipantUI();
        }

        function toggleDeafen() {
            isDeafened = !isDeafened;
            
            // If deafening, automatically mute mic as well per Discord convention
            if (isDeafened && !isMuted) {
                toggleMute();
            }

            // Mute all remote audio elements
            Object.keys(activeConnections).forEach(peerId => {
                const audioEl = document.getElementById('audio-' + peerId);
                if (audioEl) audioEl.muted = isDeafened;
            });

            if (isDeafened) {
                btnDeafen.innerHTML = '<i class="fa-solid fa-headphones-slash text-red-400 text-sm"></i>';
                btnDeafen.classList.add('bg-[#ed4245]/20');
                mobileBtnDeafen.innerHTML = '<i class="fa-solid fa-headphones-slash text-lg"></i>';
                mobileBtnDeafen.classList.add('bg-[#ed4245]');
            } else {
                btnDeafen.innerHTML = '<i class="fa-solid fa-headphones text-sm"></i>';
                btnDeafen.classList.remove('bg-[#ed4245]/20');
                mobileBtnDeafen.innerHTML = '<i class="fa-solid fa-headphones text-lg"></i>';
                mobileBtnDeafen.classList.remove('bg-[#ed4245]');
            }
        }

        function disconnectCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peer) {
                peer.destroy();
            }
            window.location.reload();
        }

        btnMute.addEventListener('click', toggleMute);
        mobileBtnMute.addEventListener('click', toggleMute);
        btnDeafen.addEventListener('click', toggleDeafen);
        mobileBtnDeafen.addEventListener('click', toggleDeafen);
        btnDisconnect.addEventListener('click', disconnectCall);
        mobileBtnDisconnect.addEventListener('click', disconnectCall);

        // Copy Room Invite Link
        btnCopyLink.addEventListener('click', () => {
            const inviteUrl = window.location.origin + window.location.pathname + '#room=' + encodeURIComponent(roomName);
            const tempInput = document.createElement('input');
            document.body.appendChild(tempInput);
            tempInput.value = inviteUrl;
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const originalText = btnCopyLink.innerHTML;
            btnCopyLink.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Copied!';
            setTimeout(() => {
                btnCopyLink.innerHTML = originalText;
            }, 2000);
        });

        // Helper for manual connection joining if peer IDs are exchanged in public lobby
        // Users can also connect by sharing the exact room URL.
    </script>
</body>
</html>
