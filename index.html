<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Voice Room</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
<style>
:root {
  --bg:#313338; --side:#2b2d31; --dark:#1e1f22;
  --blue:#5865f2; --green:#23a559; --red:#ed4245;
  --text:#f2f3f5; --muted:#b5bac1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}

#login{flex:1;display:flex;align-items:center;justify-content:center;background:var(--dark);padding:16px}
.card{background:var(--side);width:100%;max-width:400px;border-radius:12px;padding:24px}
.card h1{text-align:center;font-size:22px;margin-bottom:4px}
.card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.modes{display:flex;gap:8px;margin-bottom:14px}
.modes button{flex:1;padding:11px;border:none;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;background:var(--dark);color:var(--text)}
.modes button.on{background:var(--blue);color:#fff}
.av{width:80px;height:80px;border-radius:50%;background:var(--blue);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=text]{width:100%;padding:11px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:15px;margin-bottom:10px}
.btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
.hint{margin-top:10px;font-size:12px;color:var(--muted);text-align:center}

#room{display:none;flex-direction:column;height:100%}
.top{height:48px;background:var(--side);display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #1a1b1e;flex-shrink:0}
.top .t{font-weight:600;font-size:15px}
.top .c{font-size:13px;color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start}
.user{background:var(--side);border-radius:10px;padding:12px 8px;text-align:center;transition:box-shadow .15s;position:relative}
.user.talk{box-shadow:0 0 0 3px var(--green)}
.pic{width:56px;height:56px;border-radius:50%;background:var(--blue);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .em{position:absolute;bottom:-3px;right:-3px;font-size:16px;background:var(--side);border-radius:50%;padding:1px}
.nm{font-size:13px;font-weight:500}
.tag{font-size:11px;color:var(--muted)}
.vol{margin-top:5px}
.vol input{width:80px}

.bar{background:var(--side);padding:10px 8px 22px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;border-top:1px solid #1a1b1e;flex-shrink:0}
.bar button{width:46px;height:46px;border-radius:50%;border:none;background:#1e1f22;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bar button.red{background:var(--red)}
.bar button.on{background:var(--red)}
.code{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;background:var(--side)}

.panel{position:fixed;left:10px;right:10px;bottom:95px;background:var(--side);border-radius:12px;padding:14px;z-index:40;display:none;max-height:50vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.panel h3{font-size:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{padding:10px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:18px;cursor:pointer}
.panel input{width:100%;padding:9px;background:var(--dark);border:none;border-radius:6px;color:#fff;margin:6px 0}
.panel .x{margin-top:8px;width:100%;padding:9px;background:var(--dark);border:none;border-radius:6px;color:#fff;cursor:pointer}

.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:7px 14px;border-radius:16px;font-size:12px;display:none;z-index:50}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Voice Room</h1>
    <div class="sub">Name + photo → Join</div>
    <div class="modes">
      <button id="mPeer" class="on">Unlimited</button>
      <button id="mLive">LiveKit</button>
    </div>
    <div class="av" id="av">
      <span>?</span>
      <input type="file" id="photo" accept="image/*">
    </div>
    <input type="text" id="name" placeholder="Your name" maxlength="18">
    <button class="btn" id="go">Join Room</button>
    <div class="hint" id="note">Unlimited room code: <b>ffmic</b></div>
  </div>
</div>

<div id="room">
  <div class="top">
    <div class="t" id="title">Voice Room</div>
    <div class="c" id="count">0 online</div>
  </div>
  <div id="list"></div>
  <div class="code" id="code"></div>
  <div class="bar">
    <button id="bMute">🎤</button>
    <button id="bDeaf">🔊</button>
    <button id="bEmoji">😀</button>
    <button id="bSound">🎵</button>
    <button id="bEdit">✏️</button>
    <button id="bLeave" class="red">✖</button>
  </div>
</div>

<div class="panel" id="emojiP">
  <h3>Emoji</h3>
  <div class="grid" id="eGrid"></div>
  <button class="x" id="emClose">Close</button>
</div>

<div class="panel" id="soundP">
  <h3>Play Sound</h3>
  <input type="text" id="soundUrl" placeholder="Paste mp3/ogg link">
  <button class="x" id="playSound">Play</button>
  <button class="x" id="sClose">Close</button>
</div>

<div class="panel" id="editP">
  <h3>Edit Profile</h3>
  <input type="text" id="editName" placeholder="New name">
  <input type="file" id="editPhoto" accept="image/*">
  <button class="x" id="saveEdit">Save</button>
  <button class="x" id="eClose">Close</button>
</div>

<div class="toast" id="toast"></div>

<script>
const LK = "wss://ffmic-43kbick8.livekit.cloud";
const TOKEN = "https://ffmic.mdxnirob.workers.dev/";
const LK_ROOM = "main-room";
const HOST_ID = "ffmic-host";

const ICE = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    {
      urls: "turn:free.expressturn.com:3478",
      username: "000000002106201354",
      credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
    }
  ]
};

const EMOJIS = ["😀","😂","❤️","🔥","👍","👎","😮","😢","😡","🎉","💀","✨","👏","🙏"];

let mode = "peer";
let myName = localStorage.getItem("vr_name") || "";
let myAvatar = localStorage.getItem("vr_avatar") || "";
let stream = null, muted = false, deaf = false, myEmoji = "";
let peer = null, room = null, calls = {}, remoteInfo = {};

const $ = id => document.getElementById(id);
if (myName) $("name").value = myName;
if (myAvatar) {
  \( ("av").innerHTML = `<img src=" \){myAvatar}"><input type="file" id="photo" accept="image/*">`;
  $("photo").onchange = onPhoto;
} else $("photo").onchange = onPhoto;

function onPhoto(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    myAvatar = r.result;
    localStorage.setItem("vr_avatar", myAvatar);
    \( ("av").innerHTML = `<img src=" \){myAvatar}"><input type="file" id="photo" accept="image/*">`;
    $("photo").onchange = onPhoto;
  };
  r.readAsDataURL(f);
}

$("mPeer").onclick = () => {
  mode = "peer";
  $("mPeer").classList.add("on"); $("mLive").classList.remove("on");
  $("note").innerHTML = 'Unlimited room code: <b>ffmic</b>';
};
$("mLive").onclick = () => {
  mode = "live";
  $("mLive").classList.add("on"); $("mPeer").classList.remove("on");
  $("note").textContent = "LiveKit mode";
};

EMOJIS.forEach(e => {
  const b = document.createElement("button");
  b.textContent = e;
  b.onclick = () => {
    myEmoji = e;
    toast(e);
    draw();
    setTimeout(() => { myEmoji = ""; draw(); }, 3000);
    $("emojiP").style.display = "none";
  };
  $("eGrid").appendChild(b);
});

$("go").onclick = start;
$("bMute").onclick = () => {
  muted = !muted;
  if (stream) stream.getAudioTracks().forEach(t => t.enabled = !muted);
  if (room) room.localParticipant.setMicrophoneEnabled(!muted);
  $("bMute").classList.toggle("on", muted);
  $("bMute").textContent = muted ? "🔇" : "🎤";
};
$("bDeaf").onclick = () => {
  deaf = !deaf;
  document.querySelectorAll("audio").forEach(a => a.muted = deaf);
  $("bDeaf").classList.toggle("on", deaf);
  $("bDeaf").textContent = deaf ? "🔇" : "🔊";
};
$("bEmoji").onclick = () => $("emojiP").style.display = "block";
$("bSound").onclick = () => $("soundP").style.display = "block";
$("bEdit").onclick = () => {
  $("editName").value = myName;
  $("editP").style.display = "block";
};
$("bLeave").onclick = leave;
$("emClose").onclick = () => $("emojiP").style.display = "none";
$("sClose").onclick = () => $("soundP").style.display = "none";
$("eClose").onclick = () => $("editP").style.display = "none";
$("playSound").onclick = () => {
  const u = $("soundUrl").value.trim();
  if (!u) return;
  new Audio(u).play().catch(() => toast("Cannot play"));
  toast("Playing...");
};
$("saveEdit").onclick = () => {
  const n = $("editName").value.trim();
  if (n) { myName = n; localStorage.setItem("vr_name", n); }
  const f = $("editPhoto").files[0];
  if (f) {
    const r = new FileReader();
    r.onload = () => {
      myAvatar = r.result;
      localStorage.setItem("vr_avatar", myAvatar);
      draw();
    };
    r.readAsDataURL(f);
  } else draw();
  $("editP").style.display = "none";
  toast("Updated");
};

function toast(m) {
  $("toast").textContent = m;
  $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none", 2000);
}

async function start() {
  myName = ($("name").value || "").trim() || "Guest";
  localStorage.setItem("vr_name", myName);

  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    alert("Allow microphone");
    return;
  }

  $("login").style.display = "none";
  $("room").style.display = "flex";
  $("title").textContent = mode === "peer" ? "Unlimited Room" : "LiveKit Room";
  $("code").textContent = mode === "peer" ? "Room code: ffmic" : "";

  if (mode === "peer") startPeer();
  else startLive();
}

// ========== PEERJS ==========
function startPeer() {
  peer = new Peer(HOST_ID, { config: ICE });

  peer.on("open", id => {
    toast("You are Host");
    draw();
  });

  peer.on("call", call => {
    call.answer(stream);
    handle(call);
  });

  peer.on("connection", conn => {
    conn.on("data", d => {
      if (d && d.type === "join") {
        remoteInfo[d.id] = { name: d.name, avatar: d.avatar || "" };
        const c = peer.call(d.id, stream);
        if (c) handle(c);
        // send my info back
        conn.send({ type: "info", name: myName, avatar: myAvatar });
      }
    });
  });

  peer.on("error", err => {
    if (err.type === "unavailable-id") joinClient();
    else toast(err.type);
  });
}

function joinClient() {
  peer = new Peer({ config: ICE });

  peer.on("open", id => {
    toast("Joined ffmic");

    const call = peer.call(HOST_ID, stream);
    if (call) handle(call);

    const conn = peer.connect(HOST_ID);
    conn.on("open", () => {
      conn.send({ type: "join", id: id, name: myName, avatar: myAvatar });
    });
    conn.on("data", d => {
      if (d && d.type === "info") {
        remoteInfo[HOST_ID] = { name: d.name, avatar: d.avatar || "" };
        draw();
      }
    });

    draw();
  });

  peer.on("call", call => {
    call.answer(stream);
    handle(call);
  });
}

function handle(call) {
  calls[call.peer] = call;
  call.on("stream", s => {
    play(call.peer, s);
    draw();
  });
  call.on("close", () => {
    delete calls[call.peer];
    delete remoteInfo[call.peer];
    const a = document.getElementById("a-" + call.peer);
    if (a) a.remove();
    draw();
  });
}

function draw() {
  if (mode === "peer") drawPeer();
  else if (room) drawLive();
}

function drawPeer() {
  $("list").innerHTML = "";
  const me = make(myName, true, myAvatar, myEmoji);
  $("list").appendChild(me);

  Object.keys(calls).forEach(pid => {
    const info = remoteInfo[pid] || { name: "User", avatar: "" };
    const d = make(info.name, false, info.avatar, "");
    d.id = "u-" + pid;
    $("list").appendChild(d);
  });
  $("count").textContent = (1 + Object.keys(calls).length) + " online";
}

// ========== LIVEKIT ==========
async function startLive() {
  try {
    const res = await fetch(TOKEN + "?name=" + encodeURIComponent(myName) + "&room=" + LK_ROOM);
    const txt = await res.text();
    let data; try { data = JSON.parse(txt); } catch(e) { throw new Error("Token error"); }
    if (!data.token) throw new Error("No token");

    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, drawLive);
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, drawLive);
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, sp => {
      document.querySelectorAll(".user").forEach(u => u.classList.remove("talk"));
      sp.forEach(s => {
        const el = document.getElementById("u-" + s.identity);
        if (el) el.classList.add("talk");
      });
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind === "audio") {
        const a = track.attach();
        a.id = "a-" + p.identity;
        a.autoplay = true;
        document.body.appendChild(a);
      }
    });

    await room.connect(LK, data.token);
    await room.localParticipant.setMicrophoneEnabled(true);
    drawLive();
    toast("LiveKit connected");
  } catch (e) {
    alert("LiveKit: " + e.message);
    leave();
  }
}

function drawLive() {
  if (!room) return;
  $("list").innerHTML = "";
  const all = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
  $("count").textContent = all.length + " online";
  all.forEach(p => {
    const local = p === room.localParticipant;
    const name = local ? myName : (p.name || p.identity);
    const div = make(name, local, local ? myAvatar : null, local ? myEmoji : "");
    div.id = "u-" + p.identity;
    if (!local) {
      const vol = document.createElement("div");
      vol.className = "vol";
      vol.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
      vol.querySelector("input").oninput = e => {
        const a = document.getElementById("a-" + p.identity);
        if (a) a.volume = e.target.value;
      };
      div.appendChild(vol);
    }
    $("list").appendChild(div);
  });
}

function make(name, local, avatar, emoji) {
  const d = document.createElement("div");
  d.className = "user";
  const letter = (name || "?").charAt(0).toUpperCase();
  let pic = letter;
  if (avatar) pic = `<img src="${avatar}">`;
  d.innerHTML = `<div class="pic">\( {pic}<span class="em"> \){emoji || ""}</span></div><div class="nm">\( {name}</div> \){local ? '<div class="tag">you</div>' : ''}`;
  return d;
}

function play(id, media) {
  let a = document.getElementById("a-" + id);
  if (!a) {
    a = document.createElement("audio");
    a.id = "a-" + id;
    a.autoplay = true;
    document.body.appendChild(a);
  }
  a.srcObject = media;
}

function leave() {
  if (peer) peer.destroy();
  if (room) room.disconnect();
  if (stream) stream.getTracks().forEach(t => t.stop());
  document.querySelectorAll("audio").forEach(a => a.remove());
  location.reload();
}
</script>
</body>
  </html>
