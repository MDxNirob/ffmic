<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Voice Room</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
<style>
:root{--bg:#313338;--side:#2b2d31;--dark:#1e1f22;--blue:#5865f2;--green:#23a559;--red:#ed4245;--text:#f2f3f5;--muted:#b5bac1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
#login{flex:1;display:flex;align-items:center;justify-content:center;background:var(--dark);padding:16px}
.card{background:var(--side);width:100%;max-width:400px;border-radius:12px;padding:26px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card h1{text-align:center;font-size:24px;color:#fff;margin-bottom:6px}
.card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.modes{display:flex;gap:8px;margin-bottom:16px}
.modes button{flex:1;padding:12px;border:none;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;background:var(--dark);color:var(--text)}
.modes button.on{background:var(--blue);color:#fff}
.av{width:84px;height:84px;border-radius:50%;background:var(--blue);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;position:relative;border:3px solid #3f4147}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=text]{width:100%;padding:12px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:15px;margin-bottom:12px}
.btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer}
.hint{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}
#room{display:none;flex-direction:column;height:100%}
.top{height:48px;background:var(--side);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #1a1b1e;flex-shrink:0}
.top .t{font-weight:600;font-size:15px;color:#fff}
.top .c{font-size:13px;color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.user{background:var(--side);border-radius:10px;padding:14px 10px;text-align:center;transition:box-shadow .15s;position:relative}
.user.talk{box-shadow:0 0 0 3px var(--green)}
.pic{width:64px;height:64px;border-radius:50%;background:var(--blue);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pic .em{position:absolute;bottom:-3px;right:-3px;font-size:18px;background:var(--side);border-radius:50%;padding:2px;z-index:2}
.nm{font-size:14px;font-weight:500}
.tag{font-size:11px;color:var(--muted)}
.vol{margin-top:8px}
.vol input{width:90px;accent-color:var(--blue)}
.bar{background:var(--side);padding:10px 10px 20px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;border-top:1px solid #1a1b1e;flex-shrink:0}
.bar button{width:46px;height:46px;border-radius:50%;border:none;background:#1e1f22;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bar button.red{background:var(--red)}
.bar button.on{background:var(--red)}
.bar button.active-blue{background:var(--blue)}
.panel{position:fixed;left:12px;right:12px;bottom:90px;background:var(--side);border-radius:12px;padding:16px;z-index:50;display:none;max-height:60vh;overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.panel h3{font-size:15px;color:#fff;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{padding:12px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:20px;cursor:pointer}
.panel input[type=text]{width:100%;padding:10px;background:var(--dark);border:none;border-radius:6px;color:#fff;margin-bottom:8px}
.panel input[type=range]{width:100%;accent-color:var(--blue);margin-bottom:8px}
.panel .x{margin-top:10px;width:100%;padding:11px;background:var(--dark);border:none;border-radius:6px;color:#fff;cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;display:none;z-index:60}
.ctrl-btn{flex:1;padding:10px;border:none;border-radius:6px;color:#fff;font-weight:600;cursor:pointer}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.voice-grid button{padding:12px;background:var(--dark);border:none;border-radius:6px;color:#fff;font-size:14px;cursor:pointer}
.voice-grid button.on{background:var(--blue)}
#sessionStats{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.65);padding:4px 14px;border-radius:20px;font-size:12px;color:#fff;z-index:100;display:none}
</style>
</head>
<body>

<div id="sessionStats">⏱ <span id="sTime">0</span> min</div>

<div id="login">
  <div class="card">
    <h1>Voice Room</h1>
    <div class="sub">Enter name & photo, then join</div>
    <div class="modes">
      <button id="mPeer" class="on">Unlimited</button>
      <button id="mLive">LiveKit</button>
    </div>
    <div class="av" id="av">
      <span>?</span>
      <input type="file" id="photo" accept="image/*">
    </div>
    <input type="text" id="name" placeholder="Display name" maxlength="20">
    <button class="btn" id="go">Join Voice Room</button>
    <div class="hint" id="hint">Unlimited mode has no time limit</div>
  </div>
</div>

<div id="room">
  <div class="top">
    <div class="t" id="title">Voice Room</div>
    <div class="c" id="count">0 online</div>
  </div>
  <div id="list"></div>
  <div class="bar">
    <button id="bMute">🎤</button>
    <button id="bDeaf">🔊</button>
    <button id="bEmoji">😀</button>
    <button id="bVoice">🎭</button>
    <button id="bSound">🎵</button>
    <button id="bEdit">✏️</button>
    <button id="bLeave" class="red">✖</button>
  </div>
</div>

<div class="panel" id="emojiP">
  <h3>Emoji</h3>
  <div class="grid" id="eGrid"></div>
  <button class="x" id="emClose">Close</button>
</div>

<div class="panel" id="voiceP">
  <h3>Voice Changer</h3>
  <div class="voice-grid" id="vGrid">
    <button class="on" data-v="normal">Normal</button>
    <button data-v="kid">Kid (Light)</button>
    <button data-v="deep">Adult (Deep)</button>
    <button data-v="old">Old (Raspy)</button>
    <button data-v="robot">Robot</button>
    <button data-v="cave">Cave Echo</button>
  </div>
  <button class="x" id="vClose">Close</button>
</div>

<div class="panel" id="soundP">
  <h3>Play Audio / YouTube</h3>
  <input type="text" id="soundUrl" placeholder="Paste MP3/OGG or YouTube link">
  
  <div style="display:flex; gap:8px; margin-bottom:8px;">
    <button class="ctrl-btn" id="sPlay" style="background:var(--green)">▶ Play</button>
    <button class="ctrl-btn" id="sPause" style="background:#5c5c5c">⏸ Pause</button>
    <button class="ctrl-btn" id="sStop" style="background:var(--red)">⏹ Stop</button>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:12px;">
    <button class="ctrl-btn" id="sBack10" style="background:var(--dark); border:1px solid #3f4147;">⏪ -10s</button>
    <button class="ctrl-btn" id="sFwd10" style="background:var(--dark); border:1px solid #3f4147;">+10s ⏩</button>
  </div>

  <div style="background:var(--dark); padding:10px; border-radius:8px; margin-bottom:12px;">
    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;">
      <span id="sCurrTime">0:00</span>
      <span id="sTotalTime">0:00</span>
    </div>
    <input type="range" id="sSeek" min="0" max="100" value="0" step="0.1">
  </div>

  <label style="font-size:12px; color:var(--muted);">Volume</label>
  <input type="range" id="sVol" min="0" max="1" step="0.05" value="0.5">
  <button class="x" id="sClose">Close</button>
</div>

<div class="panel" id="editP">
  <h3>Edit Profile</h3>
  <input type="text" id="editName" placeholder="New name">
  <input type="file" id="editPhoto" accept="image/*" style="margin-bottom:12px; color:#fff;">
  <button class="x" id="saveEdit" style="background:var(--blue)">Save Profile</button>
  <button class="x" id="eClose">Close</button>
</div>

<div class="toast" id="toast"></div>

<!-- Invisible container for YouTube audio stream -->
<div id="ytContainer" style="position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none;"></div>

<script>
// ========== EXPRESSTURN SERVER SETUP ==========
const ICE = {

    {

      ],
      username: "000000002106201354",
      credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
    }
  ]
};

// Load YouTube IFrame API
const ytScript = document.createElement("script");
ytScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(ytScript);

let ytPlayer = null, isYtReady = false;
function onYouTubeIframeAPIReady() { isYtReady = true; }

function getYouTubeID(url) {
  const m = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
  return (m && m[2].length === 11) ? m[2] : null;
}

const LK = "wss://ffmic-43kbick8.livekit.cloud";
const TOKEN = "https://ffmic.mdxnirob.workers.dev/";
const LK_ROOM = "main-room";
const HOST_ID = "ffmic-host";

const EMOJIS = ["😀","😂","❤️","🔥","👍","👎","😮","😢","😡","🎉","💀","✨","👏","🙏","💯","😎"];

let mode = "peer";
let rawStream = null, processedStream = null; 
let muted = false, deaf = false, myEmoji = "";
let peer = null, room = null, myId = null;

let peers = {}; 
let dataConns = {}; 

let bgAudio = null, currentSource = null, progressInterval = null, isSeeking = false;
let sessionTimer = null, joinTime = 0;

let audioCtx, micSource, streamDest, currentEffectNode1, currentEffectNode2;

const $ = id => document.getElementById(id);

let myName = "", myAvatar = "";
try {
  myName = localStorage.getItem("vr_name") || "";
  myAvatar = localStorage.getItem("vr_avatar") || "";
} catch(e){}

if (myName) $("name").value = myName;
if (myAvatar) $("av").innerHTML = `<img src="${myAvatar}"><input type="file" id="photo" accept="image/*">`;
$("photo").onchange = onPhoto;

function processImage(file, callback) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const MAX = 120;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function onPhoto(e) {
  processImage(e.target.files[0], (base64) => {
    myAvatar = base64;
    try { localStorage.setItem("vr_avatar", myAvatar); } catch(err){}
    $("av").innerHTML = `<img src="${myAvatar}"><input type="file" id="photo" accept="image/*">`;
    $("photo").onchange = onPhoto; 
  });
}

$("mPeer").onclick = () => { mode = "peer"; $("mPeer").classList.add("on"); $("mLive").classList.remove("on"); $("hint").textContent = "Unlimited mode has no time limit"; };
$("mLive").onclick = () => { mode = "live"; $("mLive").classList.add("on"); $("mPeer").classList.remove("on"); $("hint").textContent = "LiveKit – more stable for many people"; };

EMOJIS.forEach(e => {
  const b = document.createElement("button");
  b.textContent = e;
  b.onclick = () => {
    myEmoji = e; toast(e); draw();
    setTimeout(() => { myEmoji = ""; draw(); }, 4000);
    $("emojiP").style.display = "none";
  };
  $("eGrid").appendChild(b);
});

function fmtTime(s) {
  if (isNaN(s) || !isFinite(s) || s < 0) return "0:00";
  const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
  return `${m}:${sec < 10 ? "0" : ""}${sec}`;
}

function startProgressLoop() {
  if (progressInterval) clearInterval(progressInterval);
  progressInterval = setInterval(() => {
    if (isSeeking) return;
    let cur = 0, dur = 0;
    if (currentSource === "audio" && bgAudio) { cur = bgAudio.currentTime || 0; dur = bgAudio.duration || 0; } 
    else if (currentSource === "yt" && ytPlayer && typeof ytPlayer.getCurrentTime === "function") { cur = ytPlayer.getCurrentTime() || 0; dur = ytPlayer.getDuration() || 0; }
    if (dur > 0) {
      $("sSeek").value = (cur / dur) * 100;
      $("sCurrTime").textContent = fmtTime(cur); $("sTotalTime").textContent = fmtTime(dur);
    } else { $("sCurrTime").textContent = fmtTime(cur); }
  }, 350);
}

function stopProgressLoop() {
  if (progressInterval) clearInterval(progressInterval);
  $("sSeek").value = 0; $("sCurrTime").textContent = "0:00"; $("sTotalTime").textContent = "0:00";
}

$("sSeek").oninput = (e) => {
  isSeeking = true; let dur = 0;
  if (currentSource === "audio" && bgAudio) dur = bgAudio.duration || 0;
  else if (currentSource === "yt" && ytPlayer && typeof ytPlayer.getDuration === "function") dur = ytPlayer.getDuration() || 0;
  if (dur > 0) $("sCurrTime").textContent = fmtTime((e.target.value / 100) * dur);
};

const finishSeek = (e) => {
  isSeeking = false; let dur = 0;
  if (currentSource === "audio" && bgAudio) dur = bgAudio.duration || 0;
  else if (currentSource === "yt" && ytPlayer && typeof ytPlayer.getDuration === "function") dur = ytPlayer.getDuration() || 0;
  if (dur > 0) {
    const target = (e.target.value / 100) * dur;
    if (currentSource === "audio" && bgAudio) bgAudio.currentTime = target;
    else if (currentSource === "yt" && ytPlayer) ytPlayer.seekTo(target, true);
  }
};
$("sSeek").onchange = finishSeek; $("sSeek").onmouseup = finishSeek; $("sSeek").ontouchend = finishSeek;

$("sBack10").onclick = () => {
  if (currentSource === "audio" && bgAudio) bgAudio.currentTime = Math.max(0, bgAudio.currentTime - 10);
  else if (currentSource === "yt" && ytPlayer && typeof ytPlayer.getCurrentTime === "function") ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 10), true);
};
$("sFwd10").onclick = () => {
  if (currentSource === "audio" && bgAudio) bgAudio.currentTime = Math.min(bgAudio.duration || 0, bgAudio.currentTime + 10);
  else if (currentSource === "yt" && ytPlayer && typeof ytPlayer.getCurrentTime === "function") ytPlayer.seekTo(Math.min(ytPlayer.getDuration() || 0, ytPlayer.getCurrentTime() + 10), true);
};

$("sPlay").onclick = () => {
  const url = $("soundUrl").value.trim();
  if (!url) return;
  const ytId = getYouTubeID(url);
  if (ytId) {
    if (bgAudio) { bgAudio.pause(); bgAudio = null; }
    if (!isYtReady) { toast("YouTube API loading, wait..."); return; }
    currentSource = "yt";
    if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
      ytPlayer.loadVideoById(ytId); ytPlayer.setVolume($("sVol").value * 100); ytPlayer.playVideo();
    } else {
      ytPlayer = new YT.Player("ytContainer", {
        height: "1", width: "1", videoId: ytId, playerVars: { autoplay: 1, controls: 0 },
        events: { onReady: (ev) => { ev.target.setVolume($("sVol").value * 100); ev.target.playVideo(); } }
      });
    }
    startProgressLoop(); toast("Playing YouTube audio...");
  } else {
    if (ytPlayer && typeof ytPlayer.stopVideo === "function") ytPlayer.stopVideo();
    if (bgAudio && bgAudio.src === url && bgAudio.paused) { bgAudio.play(); startProgressLoop(); return; }
    if (bgAudio) bgAudio.pause();
    currentSource = "audio"; bgAudio = new Audio(url); bgAudio.volume = $("sVol").value;
    bgAudio.play().then(() => { startProgressLoop(); toast("Playing Audio..."); }).catch(() => toast("Cannot play link"));
  }
};

$("sPause").onclick = () => {
  if (currentSource === "audio" && bgAudio) bgAudio.pause();
  if (currentSource === "yt" && ytPlayer && typeof ytPlayer.pauseVideo === "function") ytPlayer.pauseVideo();
};
$("sStop").onclick = () => {
  if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = 0; bgAudio = null; }
  if (ytPlayer && typeof ytPlayer.stopVideo === "function") ytPlayer.stopVideo();
  currentSource = null; stopProgressLoop();
};
$("sVol").oninput = (e) => {
  const v = parseFloat(e.target.value);
  if (bgAudio) bgAudio.volume = v;
  if (ytPlayer && typeof ytPlayer.setVolume === "function") ytPlayer.setVolume(v * 100);
};

$("go").onclick = start;
$("bMute").onclick = () => {
  muted = !muted;
  if (rawStream) rawStream.getAudioTracks().forEach(t => t.enabled = !muted);
  if (processedStream) processedStream.getAudioTracks().forEach(t => t.enabled = !muted);
  if (room) room.localParticipant.setMicrophoneEnabled(!muted);
  $("bMute").classList.toggle("on", muted);
  $("bMute").textContent = muted ? "🔇" : "🎤";
};
$("bDeaf").onclick = () => {
  deaf = !deaf;
  document.querySelectorAll("audio").forEach(a => a.muted = deaf);
  $("bDeaf").classList.toggle("on", deaf);
  $("bDeaf").textContent = deaf ? "🔇" : "🔊";
};

const closePanels = () => document.querySelectorAll(".panel").forEach(p => p.style.display = "none");
$("bEmoji").onclick = () => { closePanels(); $("emojiP").style.display = "block"; };
$("bVoice").onclick = () => { closePanels(); $("voiceP").style.display = "block"; };
$("bSound").onclick = () => { closePanels(); $("soundP").style.display = "block"; };
$("bEdit").onclick = () => { closePanels(); $("editName").value = myName; $("editP").style.display = "block"; };

$("emClose").onclick = closePanels; $("vClose").onclick = closePanels; $("sClose").onclick = closePanels; $("eClose").onclick = closePanels;
$("bLeave").onclick = leave;

$("saveEdit").onclick = () => {
  const n = $("editName").value.trim();
  if (n) { myName = n; try { localStorage.setItem("vr_name", n); } catch(err){} }
  const f = $("editPhoto").files[0];
  if (f) {
    processImage(f, (base64) => {
      myAvatar = base64;
      try { localStorage.setItem("vr_avatar", myAvatar); } catch(err){}
      if (mode === "peer") syncRoom(); 
      draw(); closePanels(); toast("Profile Updated");
    });
  } else { 
    if (mode === "peer") syncRoom(); 
    draw(); closePanels(); toast("Profile Updated"); 
  }
};

function toast(m) {
  $("toast").textContent = m; $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none", 2000);
}

function startSessionTracker() {
  $("sessionStats").style.display = "block"; joinTime = Date.now();
  if (sessionTimer) clearInterval(sessionTimer);
  sessionTimer = setInterval(() => { $("sTime").textContent = Math.floor((Date.now() - joinTime) / 60000); }, 1000);
}

function setupAudioProcessor(stream) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  micSource = audioCtx.createMediaStreamSource(stream);
  streamDest = audioCtx.createMediaStreamDestination();
  applyEffect("normal");
  return streamDest.stream;
}

function applyEffect(type) {
  if (!audioCtx) return;
  micSource.disconnect();
  if (currentEffectNode1) currentEffectNode1.disconnect();
  if (currentEffectNode2) currentEffectNode2.disconnect();
  currentEffectNode1 = null; currentEffectNode2 = null;

  if (type === "normal") { micSource.connect(streamDest); } 
  else if (type === "kid") {
    let hp = audioCtx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 600;
    micSource.connect(hp); hp.connect(streamDest); currentEffectNode1 = hp;
  } else if (type === "deep") {
    let lp = audioCtx.createBiquadFilter(); lp.type = "lowshelf"; lp.frequency.value = 250; lp.gain.value = 20;
    micSource.connect(lp); lp.connect(streamDest); currentEffectNode1 = lp;
  } else if (type === "old") {
    let bp = audioCtx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1200;
    micSource.connect(bp); bp.connect(streamDest); currentEffectNode1 = bp;
  } else if (type === "robot") {
    let delay = audioCtx.createDelay(); delay.delayTime.value = 0.02;
    let fb = audioCtx.createGain(); fb.gain.value = 0.8;
    micSource.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(streamDest); micSource.connect(streamDest);
    currentEffectNode1 = delay; currentEffectNode2 = fb;
  } else if (type === "cave") {
    let delay = audioCtx.createDelay(); delay.delayTime.value = 0.3;
    let fb = audioCtx.createGain(); fb.gain.value = 0.4;
    micSource.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(streamDest); micSource.connect(streamDest);
    currentEffectNode1 = delay; currentEffectNode2 = fb;
  }
}

document.querySelectorAll("#vGrid button").forEach(btn => {
  btn.onclick = (e) => {
    document.querySelectorAll("#vGrid button").forEach(b => b.classList.remove("on")); e.target.classList.add("on");
    applyEffect(e.target.dataset.v); toast("Voice: " + e.target.textContent);
    if(e.target.dataset.v !== "normal") $("bVoice").classList.add("active-blue"); else $("bVoice").classList.remove("active-blue");
  };
});

async function start() {
  myName = ($("name").value || "").trim() || "Guest";
  try { localStorage.setItem("vr_name", myName); } catch(err){}
  
  try {
    rawStream = await navigator.mediaDevices.getUserMedia({ 
      audio: { 
        echoCancellation: true, 
        noiseSuppression: false, 
        autoGainControl: false,
        sampleRate: 48000,
        channelCount: 1
      }, 
      video: false 
    });
    processedStream = setupAudioProcessor(rawStream);
  } catch (e) {
    alert("Please allow microphone access to join."); return;
  }
  
  $("login").style.display = "none"; $("room").style.display = "flex";
  $("title").textContent = mode === "peer" ? "Unlimited Room" : "LiveKit Room";
  if (mode === "peer") startPeer(); else startLive();
}

// ========== PEERJS FULL MESH & DATA SYNC ==========
function syncRoom() {
  if (myId !== HOST_ID) return; 
  const state = { [myId]: { name: myName, avatar: myAvatar } };
  Object.keys(peers).forEach(pid => { state[pid] = { name: peers[pid].name, avatar: peers[pid].avatar }; });
  Object.values(dataConns).forEach(c => { if (c.open) c.send({ type: "sync", state: state }); });
  draw();
}

function startPeer() {
  peer = new Peer(HOST_ID, { config: ICE, debug: 1 });
  
  peer.on("open", id => { myId = id; toast("You are Host"); draw(); startSessionTracker(); });
  peer.on("call", call => { call.answer(processedStream); addPeer(call.peer, call); });
  
  peer.on("connection", conn => {
    conn.on("open", () => { dataConns[conn.peer] = conn; });
    conn.on("data", d => {
      if (d && d.type === "join") {
        peers[d.id] = peers[d.id] || {};
        peers[d.id].name = d.name;
        peers[d.id].avatar = d.avatar || "";
        const c = peer.call(d.id, processedStream);
        if (c) addPeer(d.id, c);
        syncRoom(); 
      }
    });
    conn.on("close", () => {
      delete dataConns[conn.peer];
      if (peers[conn.peer]) {
        if (peers[conn.peer].call) peers[conn.peer].call.close();
        delete peers[conn.peer];
      }
      syncRoom(); 
    });
  });
  
  peer.on("error", err => {
    if (err.type === "unavailable-id") joinAsClient(); else toast(err.type);
  });
}

function joinAsClient() {
  peer = new Peer({ config: ICE, debug: 1 });
  peer.on("open", id => {
    myId = id; toast("Joined room"); startSessionTracker();
    
    const call = peer.call(HOST_ID, processedStream);
    if (call) addPeer(HOST_ID, call);
    
    const conn = peer.connect(HOST_ID);
    conn.on("open", () => { conn.send({ type: "join", id: id, name: myName, avatar: myAvatar }); });
    
    conn.on("data", d => {
      if (d && d.type === "sync") {
        Object.keys(d.state).forEach(pid => {
          if (pid === myId) return;
          peers[pid] = peers[pid] || {};
          peers[pid].name = d.state[pid].name;
          peers[pid].avatar = d.state[pid].avatar;
          
          if (!peers[pid].call && pid !== HOST_ID) {
            if (myId < pid) { 
               const c = peer.call(pid, processedStream);
               if (c) addPeer(pid, c);
            }
          }
        });
        draw();
      }
    });
  });
  peer.on("call", call => { call.answer(processedStream); addPeer(call.peer, call); });
}

function addPeer(id, call) {
  peers[id] = peers[id] || {};
  peers[id].call = call;
  call.on("stream", remote => { play(id, remote); draw(); });
  call.on("close", () => {
    delete peers[id];
    const a = document.getElementById("a-" + id); if (a) a.remove();
    draw();
  });
}

function draw() {
  if (mode === "peer") drawPeer(); else if (room) drawLive();
}

function drawPeer() {
  $("list").innerHTML = "";
  $("list").appendChild(make(myName, true, myAvatar, myEmoji));
  Object.keys(peers).forEach(pid => {
    const info = peers[pid];
    const d = make(info.name || "User", false, info.avatar || "", "");
    d.id = "u-" + pid;
    const vol = document.createElement("div"); vol.className = "vol";
    vol.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
    vol.querySelector("input").oninput = e => { const a = document.getElementById("a-" + pid); if (a) a.volume = e.target.value; };
    d.appendChild(vol); $("list").appendChild(d);
  });
  $("count").textContent = (1 + Object.keys(peers).length) + " online";
}

// ========== LIVEKIT ==========
async function startLive() {
  try {
    const res = await fetch(TOKEN + "?name=" + encodeURIComponent(myName) + "&room=" + LK_ROOM);
    const txt = await res.text();
    let data; try { data = JSON.parse(txt); } catch(e) { throw new Error("Token error"); }
    if (!data.token) throw new Error("No token");

    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    room.on(LivekitClient.RoomEvent.ParticipantConnected, drawLive);
    room.on(LivekitClient.RoomEvent.ParticipantDisconnected, drawLive);
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, sp => {
      document.querySelectorAll(".user").forEach(u => u.classList.remove("talk"));
      sp.forEach(s => { const el = document.getElementById("u-" + s.identity); if (el) el.classList.add("talk"); });
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind === "audio") { const a = track.attach(); a.id = "a-" + p.identity; a.autoplay = true; document.body.appendChild(a); }
    });
    
    await room.connect(LK, data.token);
    await room.localParticipant.publishTrack(processedStream.getAudioTracks()[0]);
    drawLive(); toast("Connected"); startSessionTracker();
  } catch (e) {
    alert("LiveKit Error: " + e.message); leave();
  }
}

function drawLive() {
  if (!room) return;
  $("list").innerHTML = "";
  const all = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];
  $("count").textContent = all.length + " online";
  all.forEach(p => {
    const local = p === room.localParticipant;
    const name = local ? myName : (p.name || p.identity);
    const div = make(name, local, local ? myAvatar : null, local ? myEmoji : "");
    div.id = "u-" + p.identity;
    if (!local) {
      const vol = document.createElement("div"); vol.className = "vol";
      vol.innerHTML = `<input type="range" min="0" max="1" step="0.05" value="1">`;
      vol.querySelector("input").oninput = e => { const a = document.getElementById("a-" + p.identity); if (a) a.volume = e.target.value; };
      div.appendChild(vol);
    }
    $("list").appendChild(div);
  });
}

function make(name, local, avatar, emoji) {
  const d = document.createElement("div"); d.className = "user";
  const letter = (name || "?").charAt(0).toUpperCase();
  let pic = letter; if (avatar) pic = `<img src="${avatar}">`;
  d.innerHTML = `<div class="pic">${pic}${emoji ? `<span class="em">${emoji}</span>` : ''}</div><div class="nm">${name}</div>${local ? '<div class="tag">you</div>' : ''}`;
  return d;
}

function play(id, media) {
  let a = document.getElementById("a-" + id);
  if (!a) { a = document.createElement("audio"); a.id = "a-" + id; a.autoplay = true; document.body.appendChild(a); }
  a.srcObject = media;
}

function leave() {
  if (peer) peer.destroy(); if (room) room.disconnect();
  if (rawStream) rawStream.getTracks().forEach(t => t.stop());
  if (bgAudio) { bgAudio.pause(); bgAudio = null; }
  if (ytPlayer && typeof ytPlayer.stopVideo === "function") ytPlayer.stopVideo();
  if (sessionTimer) clearInterval(sessionTimer); stopProgressLoop();
  document.querySelectorAll("audio").forEach(a => a.remove());
  location.reload();
}
</script>
