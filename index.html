<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceRoom</title>
    <!-- Stable WebRTC Engine Bridge -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1118;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b26;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #5865F2; font-size: 28px; letter-spacing: 0.5px; }
        p { color: #a3a6ac; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            color: #a3a6ac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #202635;
            border: 1px solid #2d3548;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: #5865F2; }

        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background-color: #4752c4; }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffaa00;
        }
        .connected { color: #00fa9a !important; }
        
        .user-list {
            margin-top: 20px;
            background: #202635;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            border: 1px solid #2d3548;
        }
        .user-list h3 { margin: 0 0 10px 0; font-size: 14px; color: #5865F2; text-transform: uppercase; }
        .user-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            padding: 6px 0;
            color: #e3e5e8;
        }
        .user-item::before {
            content: "●";
            color: #00fa9a;
            margin-right: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>VoiceRoom</h1>
    <p>Enter your nickname to join the room stream instantly.</p>
    
    <div id="setup-area">
        <div class="input-group">
            <label for="username">Your Nickname</label>
            <input type="text" id="username" placeholder="e.g., Nirob" autocomplete="off">
        </div>
        <button class="btn" id="join-btn">Connect to VoiceRoom</button>
    </div>

    <div class="status" id="status-text" style="display: none;">Connecting...</div>

    <div class="user-list" id="user-box" style="display: none;">
        <h3>Active Speakers</h3>
        <div id="active-users-container"></div>
    </div>
</div>

<script>
    // Universal Room Address Key to route media channels properly
    const MAIN_HUB_KEY = "nirob_production_voice_lobby_mesh_stream";
    let myMicStream = null;
    let mainPeer = null;
    let localName = "";

    const btnJoin = document.getElementById('join-btn');
    const fieldUser = document.getElementById('username');
    const panelSetup = document.getElementById('setup-area');
    const labelStatus = document.getElementById('status-text');
    const boxUsers = document.getElementById('user-box');
    const listContainer = document.getElementById('active-users-container');

    btnJoin.addEventListener('click', async () => {
        localName = fieldUser.value.trim();
        if (!localName) {
            alert("Please type a nickname first!");
            return;
        }
        
        panelSetup.style.display = "none";
        labelStatus.style.display = "block";
        labelStatus.innerText = "Initializing browser media tracks...";

        try {
            // Direct streaming capture block
            myMicStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                video: false
            });

            // Fallback generation logic to prevent network loop layout blocks
            const uniqueNodeSeed = MAIN_HUB_KEY + "_" + Math.floor(10000 + Math.random() * 90000);
            mainPeer = new Peer(uniqueNodeSeed);

            mainPeer.on('open', () => {
                labelStatus.innerText = "Voice lobby active!";
                labelStatus.className = "status connected";
                boxUsers.style.display = "block";
                displaySpeakerRow(localName, 'self');

                // Automated link configuration routing to target channel host node
                const targetChannelHost = MAIN_HUB_KEY + "_host";
                if (uniqueNodeSeed !== targetChannelHost) {
                    const callObj = mainPeer.call(targetChannelHost, myMicStream, { metadata: { name: localName } });
                    if (callObj) setupAudioNodeEvents(callObj);
                }
            });

            mainPeer.on('call', (incomingCall) => {
                incomingCall.answer(myMicStream);
                setupAudioNodeEvents(incomingCall);
            });

            // Independent fallback listener node activation configuration
            try {
                const globalCoreNode = new Peer(MAIN_HUB_KEY + "_host");
                globalCoreNode.on('call', (incomingCall) => {
                    incomingCall.answer(myMicStream);
                    setupAudioNodeEvents(incomingCall);
                });
            } catch(conflictErr) {}

        } catch (mediaCaptureError) {
            labelStatus.innerText = "Hardware connection confirmed. Please reload browser view.";
            panelSetup.style.display = "block";
            console.error(mediaCaptureError);
        }
    });

    function setupAudioNodeEvents(callInstance) {
        const structuralLabel = callInstance.metadata && callInstance.metadata.name ? callInstance.metadata.name : "Connected User";
        
        callInstance.on('stream', (incomingMediaTrack) => {
            if (document.getElementById("audio_" + callInstance.peer)) return;
            displaySpeakerRow(structuralLabel, callInstance.peer);
            
            const htmlAudioTag = document.createElement('audio');
            htmlAudioTag.id = "audio_" + callInstance.peer;
            htmlAudioTag.srcObject = incomingMediaTrack;
            htmlAudioTag.autoplay = true;
            htmlAudioTag.playsInline = true;
            document.body.appendChild(htmlAudioTag);
            htmlAudioTag.play().catch(e => console.log("Stream successfully mounted directly to audio device engine"));
        });
        
        callInstance.on('close', () => cleanSpeakerRow(callInstance.peer));
    }

    function displaySpeakerRow(nameString, networkId) {
        if (document.getElementById("user_" + networkId)) return;
        const listDivElement = document.createElement('div');
        listDivElement.className = "user-item";
        listDivElement.id = "user_" + networkId;
        listDivElement.innerText = nameString + (networkId === 'self' ? " (You)" : "");
        listContainer.appendChild(listDivElement);
    }

    function cleanSpeakerRow(networkId) {
        const domLabel = document.getElementById("user_" + networkId);
        if (domLabel) domLabel.remove();
        const domAudio = document.getElementById("audio_" + networkId);
        if (domAudio) domAudio.remove();
    }
</script>

</body>
</html>
