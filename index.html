<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Room</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1f22;
      color: #dbdee1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      background: #2b2d31;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e1f22;
    }
    .topbar .left { font-weight: 600; color: #fff; }
    .online-count { font-size: 0.85rem; color: #949ba4; }
    #login-screen, #room-screen { flex: 1; display: flex; flex-direction: column; }
    #room-screen { display: none; }
    .login-box {
      max-width: 360px;
      margin: 40px auto;
      padding: 24px;
      background: #2b2d31;
      border-radius: 12px;
      text-align: center;
    }
    .login-box h1 { color: #fff; margin-bottom: 8px; font-size: 1.5rem; }
    .login-box p { color: #949ba4; margin-bottom: 20px; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }
    input, select { background: #1e1f22; color: #fff; }
    button {
      background: #5865f2;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: #4752c4; }
    .avatar-preview {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #5865f2;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #fff; overflow: hidden;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    #participants {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .person {
      background: #2b2d31;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      position: relative;
      transition: box-shadow 0.2s;
    }
    .person.speaking {
      box-shadow: 0 0 0 3px #23a559;
    }
    .person .av {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #5865f2;
      margin: 0 auto 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff; overflow: hidden;
      position: relative;
    }
    .person .av img { width: 100%; height: 100%; object-fit: cover; }
    .person .emoji {
      position: absolute; bottom: -4px; right: -4px;
      font-size: 1.3rem; background: #2b2d31; border-radius: 50%;
      padding: 2px;
    }
    .person .name { font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
    .controls-row {
      display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    }
    .mini-btn {
      background: #4e5058; border: none; color: #fff;
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 0.9rem; cursor: pointer;
    }
    .bottom-bar {
      background: #2b2d31;
      padding: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid #1e1f22;
    }
    .bottom-bar button {
      width: auto; padding: 10px 16px; margin: 0;
    }
    .btn-red { background: #ed4245 !important; }
    .btn-gray { background: #4e5058 !important; }
    .hidden { display: none !important; }
    .settings-panel {
      position: fixed; bottom: 70px; left: 12px; right: 12px;
      background: #2b2d31; border-radius: 12px; padding: 16px;
      z-index: 100; max-height: 60vh; overflow-y: auto;
    }
    .settings-panel h3 { margin-bottom: 12px; color: #fff; }
    .voice-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .voice-btn {
      padding: 10px; background: #1e1f22; border: none;
      color: #fff; border-radius: 8px; cursor: pointer;
    }
    .voice-btn.active { background: #5865f2; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-box">
      <h1>Voice Room</h1>
      <p>Enter name & photo to join</p>
      <div class="avatar-preview" id="avatarPreview">?</div>
      <input type="text" id="nameInput" placeholder="Your name" maxlength="20" />
      <input type="file" id="photoInput" accept="image/*" />
      <button id="joinBtn">Join Room</button>
    </div>
  </div>

  <!-- ROOM -->
  <div id="room-screen">
    <div class="topbar">
      <div class="left">Voice Room</div>
      <div class="online-count" id="onlineCount">0 online</div>
    </div>

    <div id="participants"></div>

    <div class="bottom-bar">
      <button class="btn-gray" id="muteBtn">🎤 Mute</button>
      <button class="btn-gray" id="deafenBtn">🔊 Deafen</button>
      <button class="btn-gray" id="camBtn">📷 Cam</button>
      <button class="btn-gray" id="voiceBtn">🎙️ Voice</button>
      <button class="btn-gray" id="settingsBtn">⚙️</button>
      <button class="btn-red" id="leaveBtn">Leave</button>
    </div>
  </div>

  <!-- Voice Changer Panel -->
  <div class="settings-panel hidden" id="voicePanel">
    <h3>Voice Changer</h3>
    <div class="voice-grid" id="voiceGrid"></div>
    <button style="margin-top:12px" id="closeVoice">Close</button>
  </div>

<script>
  // ========== CONFIG ==========
  const LIVEKIT_URL = "wss://ffmic-43kbick8.livekit.cloud";
  const TOKEN_URL = "https://ffmic.mdxnirob.workers.dev/";
  const ROOM_NAME = "main-room";

  // ========== STATE ==========
  let room = null;
  let localAudioTrack = null;
  let localVideoTrack = null;
  let isMuted = false;
  let isDeafened = false;
  let isCamOn = false;
  let myName = localStorage.getItem("vr_name") || "";
  let myAvatar = localStorage.getItem("vr_avatar") || "";
  let currentPitch = 1.0;
  let audioContext = null;
  let pitchNode = null;

  // Voice presets
  const VOICE_PRESETS = [
    { name: "Normal", pitch: 1.0 },
    { name: "Kid", pitch: 1.45 },
    { name: "Boy", pitch: 1.2 },
    { name: "Girl", pitch: 1.35 },
    { name: "Adult Male", pitch: 0.85 },
    { name: "Adult Female", pitch: 1.15 },
    { name: "Deep", pitch: 0.7 },
    { name: "Helium", pitch: 1.6 },
    { name: "Robot", pitch: 1.0, robot: true },
    { name: "Monster", pitch: 0.55 },
    { name: "Radio", pitch: 0.95 },
    { name: "Chipmunk", pitch: 1.7 },
  ];

  // ========== DOM ==========
  const loginScreen = document.getElementById("login-screen");
  const roomScreen = document.getElementById("room-screen");
  const nameInput = document.getElementById("nameInput");
  const photoInput = document.getElementById("photoInput");
  const avatarPreview = document.getElementById("avatarPreview");
  const joinBtn = document.getElementById("joinBtn");
  const participantsEl = document.getElementById("participants");
  const onlineCount = document.getElementById("onlineCount");
  const muteBtn = document.getElementById("muteBtn");
  const deafenBtn = document.getElementById("deafenBtn");
  const camBtn = document.getElementById("camBtn");
  const voiceBtn = document.getElementById("voiceBtn");
  const leaveBtn = document.getElementById("leaveBtn");
  const voicePanel = document.getElementById("voicePanel");
  const voiceGrid = document.getElementById("voiceGrid");
  const closeVoice = document.getElementById("closeVoice");

  // Pre-fill
  if (myName) nameInput.value = myName;
  if (myAvatar) {
    avatarPreview.innerHTML = `<img src="${myAvatar}">`;
  }

  photoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      myAvatar = reader.result;
      avatarPreview.innerHTML = `<img src="${myAvatar}">`;
    };
    reader.readAsDataURL(file);
  });

  joinBtn.addEventListener("click", start);
  muteBtn.addEventListener("click", toggleMute);
  deafenBtn.addEventListener("click", toggleDeafen);
  camBtn.addEventListener("click", toggleCam);
  voiceBtn.addEventListener("click", () => voicePanel.classList.toggle("hidden"));
  closeVoice.addEventListener("click", () => voicePanel.classList.add("hidden"));
  leaveBtn.addEventListener("click", leave);

  // Build voice buttons
  VOICE_PRESETS.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.className = "voice-btn" + (i === 0 ? " active" : "");
    btn.textContent = p.name;
    btn.onclick = () => {
      document.querySelectorAll(".voice-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      setVoice(p.pitch);
    };
    voiceGrid.appendChild(btn);
  });

  async function start() {
    myName = nameInput.value.trim() || "Guest";
    localStorage.setItem("vr_name", myName);
    if (myAvatar) localStorage.setItem("vr_avatar", myAvatar);

    loginScreen.style.display = "none";
    roomScreen.style.display = "flex";

    try {
      const res = await fetch(`\( {TOKEN_URL}?name= \){encodeURIComponent(myName)}&room=${ROOM_NAME}`);
      const data = await res.json();
      if (!data.token) throw new Error("No token");

      room = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true,
      });

      room.on(LivekitClient.RoomEvent.ParticipantConnected, renderParticipants);
      room.on(LivekitClient.RoomEvent.ParticipantDisconnected, renderParticipants);
      room.on(LivekitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
      room.on(LivekitClient.RoomEvent.TrackUnsubscribed, renderParticipants);
      room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, handleSpeakers);
      room.on(LivekitClient.RoomEvent.LocalTrackPublished, renderParticipants);

      await room.connect(LIVEKIT_URL, data.token);

      // Publish microphone
      localAudioTrack = await LivekitClient.createLocalAudioTrack({
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      });
      await room.localParticipant.publishTrack(localAudioTrack);

      renderParticipants();
    } catch (err) {
      alert("Failed to join: " + err.message);
      console.error(err);
      leave();
    }
  }

  function handleTrackSubscribed(track, publication, participant) {
    if (track.kind === "audio") {
      const el = track.attach();
      el.id = `audio-${participant.identity}`;
      document.body.appendChild(el);
    }
    if (track.kind === "video") {
      renderParticipants();
    }
  }

  function handleSpeakers(speakers) {
    document.querySelectorAll(".person").forEach(el => el.classList.remove("speaking"));
    speakers.forEach(s => {
      const el = document.getElementById(`person-${s.identity}`);
      if (el) el.classList.add("speaking");
    });
  }

  function renderParticipants() {
    if (!room) return;
    participantsEl.innerHTML = "";
    const all = [room.localParticipant, ...Array.from(room.remoteParticipants.values())];

    onlineCount.textContent = `${all.length} online`;

    all.forEach(p => {
      const div = document.createElement("div");
      div.className = "person";
      div.id = `person-${p.identity}`;

      const isLocal = p === room.localParticipant;
      const name = isLocal ? myName : (p.name || p.identity);
      const initial = name.charAt(0).toUpperCase();

      let avatarHtml = initial;
      if (isLocal && myAvatar) {
        avatarHtml = `<img src="${myAvatar}">`;
      }

      div.innerHTML = `
        <div class="av">\( {avatarHtml}<span class="emoji" id="emoji- \){p.identity}"></span></div>
        <div class="name">\( {name} \){isLocal ? " (you)" : ""}</div>
        <div class="controls-row">
          ${!isLocal ? `
            <button class="mini-btn" onclick="toggleRemoteMute('${p.identity}')">🔇</button>
            <input type="range" min="0" max="1" step="0.05" value="1" 
              oninput="setVolume('${p.identity}', this.value)" style="width:60px">
          ` : ""}
        </div>
      `;
      participantsEl.appendChild(div);

      // Attach video if exists
      p.videoTrackPublications.forEach(pub => {
        if (pub.track) {
          const videoEl = pub.track.attach();
          videoEl.style.width = "100%";
          videoEl.style.borderRadius = "8px";
          videoEl.style.marginTop = "6px";
          div.appendChild(videoEl);
        }
      });
    });
  }

  function toggleMute() {
    isMuted = !isMuted;
    if (localAudioTrack) localAudioTrack.mute = isMuted;
    muteBtn.textContent = isMuted ? "🎤 Unmute" : "🎤 Mute";
  }

  function toggleDeafen() {
    isDeafened = !isDeafened;
    document.querySelectorAll("audio").forEach(a => a.muted = isDeafened);
    deafenBtn.textContent = isDeafened ? "🔊 Undeafen" : "🔊 Deafen";
  }

  async function toggleCam() {
    if (!isCamOn) {
      localVideoTrack = await LivekitClient.createLocalVideoTrack({
        resolution: LivekitClient.VideoPresets.h720.resolution,
      });
      await room.localParticipant.publishTrack(localVideoTrack);
      isCamOn = true;
      camBtn.textContent = "📷 Off";
    } else {
      if (localVideoTrack) {
        await room.localParticipant.unpublishTrack(localVideoTrack);
        localVideoTrack.stop();
        localVideoTrack = null;
      }
      isCamOn = false;
      camBtn.textContent = "📷 Cam";
    }
    renderParticipants();
  }

  window.toggleRemoteMute = function(identity) {
    const audio = document.getElementById(`audio-${identity}`);
    if (audio) {
      audio.muted = !audio.muted;
    }
  };

  window.setVolume = function(identity, val) {
    const audio = document.getElementById(`audio-${identity}`);
    if (audio) audio.volume = parseFloat(val);
  };

  function setVoice(pitch) {
    currentPitch = pitch;
    // Simple pitch shift using playbackRate on a clone is limited.
    // For real pitch we would need AudioWorklet. For now we use a basic approach.
    alert("Voice changer preset selected: " + pitch + "\n(Full real-time pitch shift needs AudioWorklet - can be upgraded)");
  }

  async function leave() {
    if (room) await room.disconnect();
    if (localAudioTrack) localAudioTrack.stop();
    if (localVideoTrack) localVideoTrack.stop();
    location.reload();
  }
</script>
</body>
  </html>
