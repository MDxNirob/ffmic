<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceRoom</title>
    <!-- Lightweight native browser networking bridge -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e1118;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #161b26;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #5865F2; font-size: 28px; letter-spacing: 0.5px; }
        p { color: #a3a6ac; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            color: #a3a6ac;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #202635;
            border: 1px solid #2d3548;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: #5865F2; }

        .btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover { background-color: #4752c4; }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffaa00;
        }
        .connected { color: #00fa9a !important; }
        
        .user-list {
            margin-top: 20px;
            background: #202635;
            border-radius: 8px;
            padding: 15px;
            text-align: left;
            border: 1px solid #2d3548;
        }
        .user-list h3 { margin: 0 0 10px 0; font-size: 14px; color: #5865F2; text-transform: uppercase; }
        .user-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            padding: 6px 0;
            color: #e3e5e8;
        }
        .user-item::before {
            content: "●";
            color: #00fa9a;
            margin-right: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>VoiceRoom</h1>
    <p>Enter your nickname to join the room stream instantly.</p>
    
    <div id="setup-area">
        <div class="input-group">
            <label for="username">Your Nickname</label>
            <input type="text" id="username" placeholder="e.g., Nirob" autocomplete="off">
        </div>
        <button class="btn" id="join-btn">Connect to VoiceRoom</button>
    </div>

    <div class="status" id="status-text" style="display: none;">Connecting...</div>

    <div class="user-list" id="user-box" style="display: none;">
        <h3>Active Speakers</h3>
        <div id="active-users-container"></div>
    </div>
</div>

<script>
    const FIXED_ROOM_SEAL = "nirob_ultra_voice_lobby_production_stream";
    let myAudioStream = null;
    let bgt = null;
    let myName = "";
    const connectionsMap = {};

    const joinBtn = document.getElementById('join-btn');
    const inputField = document.getElementById('username');
    const setupArea = document.getElementById('setup-area');
    const statusText = document.getElementById('status-text');
    const userBox = document.getElementById('user-box');
    const usersContainer = document.getElementById('active-users-container');

    joinBtn.addEventListener('click', async () => {
        myName = inputField.value.trim();
        if (!myName) {
            alert("Please type a nickname first!");
            return;
        }
        
        setupArea.style.display = "none";
        statusText.style.display = "block";
        statusText.innerText = "Connecting to VoiceRoom channels...";

        try {
            // Grab microphone input stream cleanly
            myAudioStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
                video: false
            });

            // Start native browser network bridge instance
            bgt = new Bugout(FIXED_ROOM_SEAL);

            bgt.on("server", () => {
                statusText.innerText = "Voice lobby active!";
                statusText.className = "status connected";
                userBox.style.display = "block";
                renderUserRow(myName, 'self');
                
                // Broadcast presence to all listening browsers
                bgt.send({ type: "join", name: myName, address: bgt.address });
            });

            bgt.on("message", (address, packet) => {
                if (address === bgt.address) return;

                if (packet.type === "join") {
                    renderUserRow(packet.name, address);
                    startVoiceLink(address, packet.name, true);
                }
            });

            // Automated handle for direct WebRTC incoming connections
            bgt.on("seen", (address) => {
                if (connectionsMap[address]) return;
                startVoiceLink(address, "Speaker", false);
            });

        } catch (err) {
            statusText.innerText = "Network engine layout block. Please try reloading standard URL.";
            setupArea.style.display = "block";
            console.error(err);
        }
    });

    function startVoiceLink(peerAddress, speakerName, createOffer) {
        if (connectionsMap[peerAddress]) return;

        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:://google.com' }] });
        connectionsMap[peerAddress] = pc;

        myAudioStream.getTracks().forEach(track => pc.addTrack(track, myAudioStream));

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                bgt.send({ type: "ice", target: peerAddress, candidate: event.candidate });
            }
        };

        pc.ontrack = (event) => {
            if (document.getElementById("audio_" + peerAddress)) return;
            renderUserRow(speakerName, peerAddress);

            const htmlAudioTag = document.createElement('audio');
            htmlAudioTag.id = "audio_" + peerAddress;
            htmlAudioTag.srcObject = event.streams[0];
            htmlAudioTag.autoplay = true;
            htmlAudioTag.playsInline = true;
            document.body.appendChild(htmlAudioTag);
            htmlAudioTag.play().catch(e => console.log("Stream linked directly to audio outputs."));
        };

        if (createOffer) {
            pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
                bgt.send({ type: "sdp", target: peerAddress, sdp: pc.localDescription });
            });
        }

        // Catch background signaling packets
        bgt.on("message", (address, packet) => {
            if (packet.target !== bgt.address) return;

            if (packet.type === "sdp") {
                pc.setRemoteDescription(new RTCSessionDescription(packet.sdp)).then(() => {
                    if (pc.remoteDescription.type === "offer") {
                        pc.createAnswer().then(answer => pc.setLocalDescription(answer)).then(() => {
                            bgt.send({ type: "sdp", target: address, sdp: pc.localDescription });
                        });
                    }
                });
            } else if (packet.type === "ice") {
                pc.addIceCandidate(new RTCIceCandidate(packet.candidate)).catch(e => {});
            }
        });
    }

    function renderUserRow(nameString, networkId) {
        if (document.getElementById("user_" + networkId)) return;
        const listDivElement = document.createElement('div');
        listDivElement.className = "user-item";
        listDivElement.id = "user_" + networkId;
        listDivElement.innerText = nameString + (networkId === 'self' ? " (You)" : "");
        usersContainer.appendChild(listDivElement);
    }
</script>

</body>
</html>
