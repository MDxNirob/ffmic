<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Room</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1f22;
      color: #dbdee1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      background: #2b2d31;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar .left { font-weight: 600; color: #fff; }
    .online-count { font-size: 0.85rem; color: #949ba4; }
    .screen { flex: 1; display: none; flex-direction: column; }
    .screen.active { display: flex; }
    .box {
      max-width: 380px;
      margin: 30px auto;
      padding: 24px;
      background: #2b2d31;
      border-radius: 12px;
      text-align: center;
    }
    h1 { color: #fff; margin-bottom: 8px; font-size: 1.4rem; }
    p { color: #949ba4; margin-bottom: 16px; font-size: 0.9rem; }
    input, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
    }
    input { background: #1e1f22; color: #fff; }
    button {
      background: #5865f2;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #4e5058; }
    button.danger { background: #ed4245; }
    .mode-btns { display: flex; gap: 10px; margin-bottom: 16px; }
    .mode-btns button { flex: 1; }
    #participants {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .person {
      background: #2b2d31;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .person.speaking { box-shadow: 0 0 0 3px #23a559; }
    .av {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #5865f2;
      margin: 0 auto 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: #fff;
    }
    .name { font-size: 0.85rem; margin-bottom: 6px; }
    .bottom-bar {
      background: #2b2d31;
      padding: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .bottom-bar button { width: auto; padding: 10px 14px; margin: 0; }
  </style>
</head>
<body>

  <div id="login" class="screen active">
    <div class="box">
      <h1>Voice Room</h1>
      <p>Choose mode and join</p>
      <div class="mode-btns">
        <button id="modePeer">Unlimited (PeerJS)</button>
        <button id="modeLive" class="secondary">LiveKit</button>
      </div>
      <input type="text" id="nameInput" placeholder="Your name" maxlength="20" />
      <button id="joinBtn">Join Room</button>
      <p style="font-size:0.75rem;margin-top:8px" id="modeInfo">Selected: Unlimited PeerJS + ExpressTURN</p>
    </div>
  </div>

  <div id="room" class="screen">
    <div class="topbar">
      <div class="left" id="roomTitle">Voice Room</div>
      <div class="online-count" id="onlineCount">0 online</div>
    </div>
    <div id="participants"></div>
    <div class="bottom-bar">
      <button class="secondary" id="muteBtn">🎤 Mute</button>
      <button class="secondary" id="deafenBtn">🔊 Deafen</button>
      <button class="danger" id="leaveBtn">Leave</button>
    </div>
  </div>

<script>
  const LIVEKIT_URL = "wss://ffmic-43kbick8.livekit.cloud";
  const TOKEN_URL = "https://ffmic.mdxnirob.workers.dev/";
  const ROOM_NAME = "main-room";

  const TURN_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      {
        urls: "turn:free.expressturn.com:3478",
        username: "000000002106201354",
        credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
      }
    ]
  };

  let mode = "peer";
  let myName = localStorage.getItem("vr_name") || "";
  let peer = null;
  let room = null;
  let localStream = null;
  let isMuted = false;
  let isDeafened = false;

  const login = document.getElementById("login");
  const roomEl = document.getElementById("room");
  const nameInput = document.getElementById("nameInput");
  const joinBtn = document.getElementById("joinBtn");
  const modePeerBtn = document.getElementById("modePeer");
  const modeLiveBtn = document.getElementById("modeLive");
  const modeInfo = document.getElementById("modeInfo");
  const participants = document.getElementById("participants");
  const onlineCount = document.getElementById("onlineCount");
  const roomTitle = document.getElementById("roomTitle");
  const muteBtn = document.getElementById("muteBtn");
  const deafenBtn = document.getElementById("deafenBtn");
  const leaveBtn = document.getElementById("leaveBtn");

  if (myName) nameInput.value = myName;

  modePeerBtn.onclick = function() {
    mode = "peer";
    modePeerBtn.classList.remove("secondary");
    modeLiveBtn.classList.add("secondary");
    modeInfo.textContent = "Selected: Unlimited PeerJS + ExpressTURN";
  };

  modeLiveBtn.onclick = function() {
    mode = "live";
    modeLiveBtn.classList.remove("secondary");
    modePeerBtn.classList.add("secondary");
    modeInfo.textContent = "Selected: LiveKit (better quality)";
  };

  joinBtn.onclick = start;
  muteBtn.onclick = toggleMute;
  deafenBtn.onclick = toggleDeafen;
  leaveBtn.onclick = leave;

  async function start() {
    myName = nameInput.value.trim() || "Guest";
    localStorage.setItem("vr_name", myName);

    login.classList.remove("active");
    roomEl.classList.add("active");
    roomTitle.textContent = mode === "peer" ? "Unlimited Room" : "LiveKit Room";

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

      if (mode === "peer") {
        startPeerJS();
      } else {
        startLiveKit();
      }
    } catch (err) {
      alert("Microphone error: " + err.message);
      leave();
    }
  }

  function startPeerJS() {
    peer = new Peer({
      config: TURN_CONFIG
    });

    peer.on("open", function(id) {
      console.log("My ID:", id);
      showLocalUser();
    });

    peer.on("call", function(call) {
      call.answer(localStream);
      call.on("stream", function(remoteStream) {
        playRemoteAudio(call.peer, remoteStream);
      });
    });

    peer.on("error", function(err) {
      console.error(err);
    });
  }

  function showLocalUser() {
    participants.innerHTML = "";
    var div = document.createElement("div");
    div.className = "person";
    div.innerHTML = '<div class="av">' + myName.charAt(0).toUpperCase() + '</div><div class="name">' + myName + ' (you)</div>';
    participants.appendChild(div);
    onlineCount.textContent = "1 online (PeerJS)";
  }

  function playRemoteAudio(id, stream) {
    var audio = document.getElementById("audio-" + id);
    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "audio-" + id;
      audio.autoplay = true;
      document.body.appendChild(audio);
    }
    audio.srcObject = stream;
  }

  async function startLiveKit() {
    try {
      var url = TOKEN_URL + "?name=" + encodeURIComponent(myName) + "&room=" + ROOM_NAME;
      var res = await fetch(url);
      var text = await res.text();

      var data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Token server error. Response: " + text.substring(0, 100));
      }

      if (!data.token) throw new Error("No token in response");

      room = new LivekitClient.Room();

      room.on(LivekitClient.RoomEvent.ParticipantConnected, renderLive);
      room.on(LivekitClient.RoomEvent.ParticipantDisconnected, renderLive);
      room.on(LivekitClient.RoomEvent.TrackSubscribed, function(track, publication, participant) {
        if (track.kind === "audio") {
          var el = track.attach();
          el.id = "audio-" + participant.identity;
          document.body.appendChild(el);
        }
      });

      await room.connect(LIVEKIT_URL, data.token);
      await room.localParticipant.setMicrophoneEnabled(true);
      renderLive();
    } catch (err) {
      alert("LiveKit failed: " + err.message);
      console.error(err);
      leave();
    }
  }

  function renderLive() {
    if (!room) return;
    participants.innerHTML = "";
    var all = [room.localParticipant].concat(Array.from(room.remoteParticipants.values()));
    onlineCount.textContent = all.length + " online";

    all.forEach(function(p) {
      var div = document.createElement("div");
      div.className = "person";
      var name = (p === room.localParticipant) ? myName : (p.name || p.identity);
      div.innerHTML = '<div class="av">' + name.charAt(0).toUpperCase() + '</div><div class="name">' + name + '</div>';
      participants.appendChild(div);
    });
  }

  function toggleMute() {
    isMuted = !isMuted;
    if (localStream) {
      localStream.getAudioTracks().forEach(function(t) {
        t.enabled = !isMuted;
      });
    }
    if (room) {
      room.localParticipant.setMicrophoneEnabled(!isMuted);
    }
    muteBtn.textContent = isMuted ? "🎤 Unmute" : "🎤 Mute";
  }

  function toggleDeafen() {
    isDeafened = !isDeafened;
    document.querySelectorAll("audio").forEach(function(a) {
      a.muted = isDeafened;
    });
    deafenBtn.textContent = isDeafened ? "🔊 Undeafen" : "🔊 Deafen";
  }

  function leave() {
    if (peer) peer.destroy();
    if (room) room.disconnect();
    if (localStream) {
      localStream.getTracks().forEach(function(t) { t.stop(); });
    }
    location.reload();
  }
</script>
</body>
  </html>
