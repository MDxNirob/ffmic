<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voice Room</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.1/dist/livekit-client.umd.min.js"></script>
  <style>
    :root {
      --bg: #313338;
      --sidebar: #2b2d31;
      --dark: #1e1f22;
      --blurple: #5865f2;
      --green: #23a559;
      --red: #ed4245;
      --text: #dbdee1;
      --muted: #949ba4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== LOGIN ===== */
    #login {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--dark);
    }
    .login-card {
      background: var(--sidebar);
      width: 100%;
      max-width: 400px;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .login-card h1 {
      color: #fff;
      font-size: 22px;
      margin-bottom: 6px;
      text-align: center;
    }
    .login-card p {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 22px;
    }
    .mode-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-row button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: var(--dark);
      color: var(--text);
    }
    .mode-row button.active {
      background: var(--blurple);
      color: #fff;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: var(--dark);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 14px;
    }
    input:focus { outline: 2px solid var(--blurple); }
    .join-btn {
      width: 100%;
      padding: 12px;
      background: var(--blurple);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .join-btn:hover { background: #4752c4; }
    .hint {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* ===== ROOM ===== */
    #room {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    .topbar {
      background: var(--sidebar);
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--dark);
    }
    .topbar .title {
      font-weight: 600;
      color: #fff;
      font-size: 15px;
    }
    .topbar .online {
      font-size: 13px;
      color: var(--muted);
    }

    #participants {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      align-content: start;
    }

    .member {
      background: var(--sidebar);
      border-radius: 8px;
      padding: 16px 12px;
      text-align: center;
      transition: box-shadow 0.15s;
      position: relative;
    }
    .member.speaking {
      box-shadow: 0 0 0 3px var(--green);
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--blurple);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
      user-select: none;
    }
    .member-name {
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .you-tag {
      font-size: 11px;
      color: var(--muted);
    }

    .bottom-bar {
      background: var(--sidebar);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      border-top: 1px solid var(--dark);
    }
    .ctrl-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--dark);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn:hover { background: #3f4147; }
    .ctrl-btn.danger {
      background: var(--red);
    }
    .ctrl-btn.active-mute {
      background: var(--red);
    }

    .status {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login">
    <div class="login-card">
      <h1>Voice Room</h1>
      <p>Select a mode and enter your name</p>

      <div class="mode-row">
        <button id="btnPeer" class="active">Unlimited</button>
        <button id="btnLive">LiveKit</button>
      </div>

      <input type="text" id="nameInput" placeholder="Display name" maxlength="20" autocomplete="off" />
      <button class="join-btn" id="joinBtn">Join</button>
      <div class="hint" id="modeHint">Unlimited mode uses PeerJS + ExpressTURN (no time limit)</div>
    </div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="room">
    <div class="topbar">
      <div class="title" id="roomTitle">Voice Room</div>
      <div class="online" id="onlineText">0 online</div>
    </div>

    <div id="participants"></div>

    <div class="bottom-bar">
      <button class="ctrl-btn" id="muteBtn" title="Mute">🎤</button>
      <button class="ctrl-btn" id="deafenBtn" title="Deafen">🔊</button>
      <button class="ctrl-btn danger" id="leaveBtn" title="Leave">Leave</button>
    </div>
  </div>

  <div class="status" id="status"></div>

<script>
  // ================== CONFIG ==================
  const LIVEKIT_URL = "wss://ffmic-43kbick8.livekit.cloud";
  const TOKEN_URL   = "https://ffmic.mdxnirob.workers.dev/";
  const ROOM_NAME   = "main-room";

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      {
        urls: "turn:free.expressturn.com:3478",
        username: "000000002106201354",
        credential: "UXvxNY1DQ3mNNPzliqVLL8rHUcY="
      }
    ]
  };

  // ================== STATE ==================
  let currentMode = "peer";          // "peer" | "live"
  let myName = localStorage.getItem("vr_name") || "";
  let localStream = null;
  let isMuted = false;
  let isDeafened = false;

  // PeerJS
  let peer = null;
  let peerCalls = {};

  // LiveKit
  let lkRoom = null;

  // ================== DOM ==================
  const loginEl     = document.getElementById("login");
  const roomEl      = document.getElementById("room");
  const nameInput   = document.getElementById("nameInput");
  const joinBtn     = document.getElementById("joinBtn");
  const btnPeer     = document.getElementById("btnPeer");
  const btnLive     = document.getElementById("btnLive");
  const modeHint    = document.getElementById("modeHint");
  const participants= document.getElementById("participants");
  const onlineText  = document.getElementById("onlineText");
  const roomTitle   = document.getElementById("roomTitle");
  const muteBtn     = document.getElementById("muteBtn");
  const deafenBtn   = document.getElementById("deafenBtn");
  const leaveBtn    = document.getElementById("leaveBtn");
  const statusEl    = document.getElementById("status");

  if (myName) nameInput.value = myName;

  // ================== MODE SWITCH ==================
  btnPeer.onclick = () => {
    currentMode = "peer";
    btnPeer.classList.add("active");
    btnLive.classList.remove("active");
    modeHint.textContent = "Unlimited mode uses PeerJS + ExpressTURN (no time limit)";
  };
  btnLive.onclick = () => {
    currentMode = "live";
    btnLive.classList.add("active");
    btnPeer.classList.remove("active");
    modeHint.textContent = "LiveKit mode – better quality, monthly minute limit";
  };

  // ================== BUTTONS ==================
  joinBtn.onclick  = join;
  muteBtn.onclick  = toggleMute;
  deafenBtn.onclick= toggleDeafen;
  leaveBtn.onclick  = leave;

  function showStatus(msg, ms = 2500) {
    statusEl.textContent = msg;
    statusEl.style.display = "block";
    setTimeout(() => statusEl.style.display = "none", ms);
  }

  // ================== JOIN ==================
  async function join() {
    myName = (nameInput.value || "").trim() || "Guest";
    localStorage.setItem("vr_name", myName);

    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },
        video: false
      });
    } catch (err) {
      alert("Cannot access microphone: " + err.message);
      return;
    }

    loginEl.style.display = "none";
    roomEl.style.display = "flex";
    roomTitle.textContent = currentMode === "peer" ? "Unlimited Room" : "LiveKit Room";

    if (currentMode === "peer") {
      startPeerMode();
    } else {
      startLiveKitMode();
    }
  }

  // ================== PEERJS MODE ==================
  function startPeerMode() {
    peer = new Peer({
      config: ICE_CONFIG,
      debug: 1
    });

    peer.on("open", (id) => {
      console.log("Peer ID:", id);
      renderPeerUI();
      showStatus("Connected (Unlimited mode)");
    });

    peer.on("call", (call) => {
      call.answer(localStream);
      handlePeerCall(call);
    });

    peer.on("error", (err) => {
      console.error("Peer error:", err);
      showStatus("Peer error: " + err.type);
    });
  }

  function handlePeerCall(call) {
    peerCalls[call.peer] = call;
    call.on("stream", (remoteStream) => {
      playAudio(call.peer, remoteStream);
      renderPeerUI();
    });
    call.on("close", () => {
      delete peerCalls[call.peer];
      const a = document.getElementById("audio-" + call.peer);
      if (a) a.remove();
      renderPeerUI();
    });
  }

  function renderPeerUI() {
    participants.innerHTML = "";

    // Local user
    const localDiv = createMemberCard(myName, true);
    participants.appendChild(localDiv);

    // Remote users
    Object.keys(peerCalls).forEach((pid) => {
      const div = createMemberCard("User-" + pid.substring(0, 4), false);
      div.id = "member-" + pid;
      participants.appendChild(div);
    });

    const total = 1 + Object.keys(peerCalls).length;
    onlineText.textContent = total + " online";
  }

  // ================== LIVEKIT MODE ==================
  async function startLiveKitMode() {
    try {
      const url = TOKEN_URL + "?name=" + encodeURIComponent(myName) + "&room=" + ROOM_NAME;
      const res = await fetch(url);
      const text = await res.text();

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Invalid token response");
      }
      if (!data.token) throw new Error("No token received");

      lkRoom = new LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true
      });

      lkRoom.on(LivekitClient.RoomEvent.ParticipantConnected, renderLiveUI);
      lkRoom.on(LivekitClient.RoomEvent.ParticipantDisconnected, renderLiveUI);
      lkRoom.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, onSpeakers);

      lkRoom.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === "audio") {
          const el = track.attach();
          el.id = "audio-" + participant.identity;
          el.autoplay = true;
          document.body.appendChild(el);
        }
      });

      await lkRoom.connect(LIVEKIT_URL, data.token);
      await lkRoom.localParticipant.setMicrophoneEnabled(true);

      renderLiveUI();
      showStatus("Connected to LiveKit");
    } catch (err) {
      console.error(err);
      alert("LiveKit connection failed:\n" + err.message);
      leave();
    }
  }

  function renderLiveUI() {
    if (!lkRoom) return;
    participants.innerHTML = "";

    const all = [lkRoom.localParticipant, ...Array.from(lkRoom.remoteParticipants.values())];
    onlineText.textContent = all.length + " online";

    all.forEach((p) => {
      const isLocal = p === lkRoom.localParticipant;
      const name = isLocal ? myName : (p.name || p.identity);
      const div = createMemberCard(name, isLocal);
      div.id = "member-" + p.identity;
      participants.appendChild(div);
    });
  }

  function onSpeakers(speakers) {
    document.querySelectorAll(".member").forEach(el => el.classList.remove("speaking"));
    speakers.forEach(s => {
      const el = document.getElementById("member-" + s.identity);
      if (el) el.classList.add("speaking");
    });
  }

  // ================== HELPERS ==================
  function createMemberCard(name, isLocal) {
    const div = document.createElement("div");
    div.className = "member";
    const initial = (name || "?").charAt(0).toUpperCase();
    div.innerHTML = `
      <div class="avatar">${initial}</div>
      <div class="member-name">${name}</div>
      ${isLocal ? '<div class="you-tag">you</div>' : ''}
    `;
    return div;
  }

  function playAudio(id, stream) {
    let audio = document.getElementById("audio-" + id);
    if (!audio) {
      audio = document.createElement("audio");
      audio.id = "audio-" + id;
      audio.autoplay = true;
      document.body.appendChild(audio);
    }
    audio.srcObject = stream;
  }

  function toggleMute() {
    isMuted = !isMuted;

    if (localStream) {
      localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    }
    if (lkRoom) {
      lkRoom.localParticipant.setMicrophoneEnabled(!isMuted);
    }

    muteBtn.classList.toggle("active-mute", isMuted);
    muteBtn.textContent = isMuted ? "🔇" : "🎤";
    showStatus(isMuted ? "Microphone muted" : "Microphone unmuted");
  }

  function toggleDeafen() {
    isDeafened = !isDeafened;
    document.querySelectorAll("audio").forEach(a => a.muted = isDeafened);
    deafenBtn.textContent = isDeafened ? "🔇" : "🔊";
    showStatus(isDeafened ? "Deafened" : "Undeafened");
  }

  function leave() {
    if (peer) {
      peer.destroy();
      peer = null;
    }
    if (lkRoom) {
      lkRoom.disconnect();
      lkRoom = null;
    }
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
      localStream = null;
    }
    document.querySelectorAll("audio").forEach(a => a.remove());
    location.reload();
  }
</script>
</body>
  </html>
